// ===== 简答题 10 题 =====
{ chapter: "ch7", type: "简答题", q: "简述方差分析的基本思想。", refAnswer: "方差分析通过将总变异分解为组间变异和组内变异，比较两者的相对大小来判断不同水平之间是否存在显著差异。若组间变异远大于组内变异，说明因素对结果有显著影响。", explain: "方差分析的核心思想是变异分解。" },
{ chapter: "ch7", type: "简答题", q: "简述方差分析的三个基本假设。", refAnswer: "1. 正态性：各总体服从正态分布；2. 独立性：各观测值相互独立；3. 方差齐性：各总体方差相等。", explain: "方差分析的三个基本假设。" },
{ chapter: "ch7", type: "简答题", q: "简述方差分析中F统计量的构造和含义。", refAnswer: "F统计量=组间均方/组内均方。组间均方反映不同水平之间的系统差异（处理效应），组内均方反映随机误差。若F值较大，说明组间差异远大于随机误差，倾向于拒绝原假设。", explain: "F统计量的构造和含义。" },
{ chapter: "ch7", type: "简答题", q: "简述单因素方差分析中自由度的分解。", refAnswer: "总自由度=n-1，组间自由度=k-1，组内自由度=n-k。三者关系：n-1=(k-1)+(n-k)，即总自由度等于组间自由度加组内自由度。", explain: "自由度的分解关系。" },
{ chapter: "ch7", type: "简答题", q: "简述方差分析后为什么需要进行多重比较。", refAnswer: "方差分析拒绝原假设只说明至少有一组均值不同，但无法确定具体哪几组不同。多重比较通过两两比较，找出具体哪些组之间存在显著差异，常用LSD法和Tukey法。", explain: "多重比较的必要性。" },
{ chapter: "ch7", type: "简答题", q: "简述双因素方差分析与单因素方差分析的区别。", refAnswer: "单因素方差分析只考虑一个因素对结果的影响；双因素方差分析同时考虑两个因素，并可分析两个因素之间的交互效应，即一个因素的效应是否依赖于另一个因素的水平。", explain: "单因素与双因素的区别。" },
{ chapter: "ch7", type: "简答题", q: "简述方差分析与T检验的关系。", refAnswer: "当比较两组均值时，方差分析与T检验等价，F=t²。当比较三组及以上均值时，若使用多次T检验会增大第一类错误概率，此时应使用方差分析。", explain: "方差分析与T检验的关系。" },
{ chapter: "ch7", type: "简答题", q: "简述方差分析的判断规则。", refAnswer: "计算F统计量后，与临界值比较：若F>F临界值（或P<α），拒绝原假设，认为不同水平之间有显著差异；若F<F临界值（或P>α），不拒绝原假设，认为无显著差异。", explain: "方差分析的判断规则。" },
{ chapter: "ch7", type: "简答题", q: "简述方差分析的局限性。", refAnswer: "1. 要求正态性、独立性和方差齐性，若假设不满足需使用非参数方法；2. 对异常值敏感；3. 拒绝原假设后需多重比较才能确定具体差异；4. 只能判断是否存在差异，不能说明差异的大小和方向。", explain: "方差分析的局限性。" },
{ chapter: "ch7", type: "简答题", q: "简述方差分析在智能决策中的应用。", refAnswer: "方差分析用于比较多个方案、多个群体或多个模型的效果差异。例如在电商中比较不同推荐算法的点击率、在医疗中比较不同疗法的疗效、在制造中比较不同工艺的产品质量。结合AI工具可自动化执行方差分析与多重比较，为智能决策提供统计依据。", explain: "方差分析在智能决策中的应用。" },

// ===== 应用题 30 题 =====
{ chapter: "ch7", type: "应用题", q: "某电商平台想比较三种推荐算法的点击率是否有显著差异。算法A、B、C各测试5天，点击率数据如下：A: 10,12,11,13,14；B: 15,14,16,15,17；C: 9,10,8,11,12。请完成方差分析（α=0.05，F₀.₀₅(2,12)=3.89）。", refAnswer: "各组均值：A=12，B=15.4，C=10，总均值≈12.47。SSA=5×[(12-12.47)²+(15.4-12.47)²+(10-12.47)²]≈5×(0.22+8.58+6.10)≈74.5。SSE=各组内部平方和≈(4+0+1+1+4)+(1+1+1+1+1)+(1+0+4+0+4)=10+5+9=24。MSA=74.5/2≈37.25，MSE=24/12=2，F=37.25/2≈18.6。18.6>3.89，拒绝H₀。结论：三种算法点击率有显著差异。", explain: "单因素方差分析完整流程。" },
{ chapter: "ch7", type: "应用题", q: "某医疗器械企业想比较三种工艺的生产时间是否有显著差异。工艺A、B、C各抽4件，数据如下：A: 45,48,46,47；B: 42,44,43,45；C: 50,52,49,51。请完成方差分析（α=0.05，F₀.₀₅(2,9)=4.26）。", refAnswer: "各组均值：A=46.5，B=43.5，C=50.5，总均值≈46.83。SSA=4×[(46.5-46.83)²+(43.5-46.83)²+(50.5-46.83)²]≈4×(0.11+11.09+13.47)≈98.7。SSE≈(2.25+2.25+0.25+0.25)+(2.25+0.25+0.25+2.25)+(2.25+2.25+0.25+0.25)=5+5+5=15。MSA=98.7/2≈49.35，MSE=15/9≈1.67，F≈29.6。29.6>4.26，拒绝H₀。结论：三种工艺生产时间有显著差异。", explain: "单因素方差分析。" },
{ chapter: "ch7", type: "应用题", q: "某金融风控团队想比较三种模型的预测误差是否有显著差异。模型A、B、C各测试5次，误差数据如下：A: 10,12,11,13,14；B: 9,11,10,12,13；C: 15,16,14,17,18。请完成方差分析（α=0.05，F₀.₀₅(2,12)=3.89）。", refAnswer: "各组均值：A=12，B=11，C=16，总均值=13。SSA=5×[(12-13)²+(11-13)²+(16-13)²]=5×(1+4+9)=70。SSE≈(4+0+1+1+4)+(4+0+1+1+4)+(1+0+4+1+4)=10+10+10=30。MSA=70/2=35，MSE=30/12=2.5，F=14。14>3.89，拒绝H₀。结论：三种模型误差有显著差异。", explain: "单因素方差分析。" },
{ chapter: "ch7", type: "应用题", q: "某电商平台想比较三种促销方案的销售额是否有显著差异。方案A、B、C各测试4天，销售额如下：A: 100,110,105,115；B: 120,125,118,122；C: 90,95,88,92。请完成方差分析（α=0.05，F₀.₀₅(2,9)=4.26）。", refAnswer: "各组均值：A=107.5，B=121.25，C=91.25，总均值≈106.67。SSA=4×[(107.5-106.67)²+(121.25-106.67)²+(91.25-106.67)²]≈4×(0.69+212.6+237.7)≈1804。SSE≈(56.25+6.25+6.25+56.25)+(1.56+14.06+10.56+0.56)+(1.56+14.06+10.56+0.56)=125+26.74+26.74≈178.5。MSA=1804/2=902，MSE=178.5/9≈19.83，F≈45.5。45.5>4.26，拒绝H₀。结论：三种促销方案销售额有显著差异。", explain: "单因素方差分析。" },
{ chapter: "ch7", type: "应用题", q: "某教育机构想比较三种教学方法的学生成绩是否有显著差异。方法A、B、C各抽5名学生，成绩如下：A: 75,78,80,72,75；B: 85,88,82,86,84；C: 70,72,68,71,69。请完成方差分析（α=0.05，F₀.₀₅(2,12)=3.89）。", refAnswer: "各组均值：A=76，B=85，C=70，总均值=77。SSA=5×[(76-77)²+(85-77)²+(70-77)²]=5×(1+64+49)=570。SSE≈(1+4+16+16+1)+(0+9+9+1+1)+(0+4+4+1+1)=38+20+10=68。MSA=570/2=285，MSE=68/12≈5.67，F≈50.3。50.3>3.89，拒绝H₀。结论：三种教学方法成绩有显著差异。", explain: "单因素方差分析。" },
{ chapter: "ch7", type: "应用题", q: "某医院想比较三种疗法的有效率是否有显著差异。疗法A、B、C各治疗100人，有效人数分别为80、70、90。请用卡方检验判断（α=0.05，χ²₀.₀₅(2)=5.99）。", refAnswer: "H₀：三种疗法有效率相等。总有效率=240/300=0.8。理论频数：有效80、80、80，无效20、20、20。χ²=(80-80)²/80+(70-80)²/80+(90-80)²/80+(20-20)²/20+(30-20)²/20+(10-20)²/20=0+1.25+1.25+0+5+5=12.5。12.5>5.99，拒绝H₀。结论：三种疗法有效率有显著差异。", explain: "卡方检验用于比例比较。" },
{ chapter: "ch7", type: "应用题", q: "某电商平台想比较三种页面的转化率是否有显著差异。页面A、B、C各展示500次，转化数分别为50、70、60。请用卡方检验判断（α=0.05，χ²₀.₀₅(2)=5.99）。", refAnswer: "H₀：三种页面转化率相等。总转化率=180/1500=0.12。理论频数：转化60、60、60，未转化440、440、440。χ²=(50-60)²/60+(70-60)²/60+(60-60)²/60+(450-440)²/440+(430-440)²/440+(440-440)²/440≈1.67+1.67+0+0.23+0.23+0=3.8。3.8<5.99，不拒绝H₀。结论：三种页面转化率无显著差异。", explain: "卡方检验。" },
{ chapter: "ch7", type: "应用题", q: "某制造企业想比较三种工艺的产品合格率是否有显著差异。工艺A、B、C各抽200件，合格数分别为180、170、190。请用卡方检验判断（α=0.05，χ²₀.₀₅(2)=5.99）。", refAnswer: "H₀：三种工艺合格率相等。总合格率=540/600=0.9。理论频数：合格180、180、180，不合格20、20、20。χ²=(180-180)²/180+(170-180)²/180+(190-180)²/180+(20-20)²/20+(30-20)²/20+(10-20)²/20=0+0.56+0.56+0+5+5=11.12。11.12>5.99，拒绝H₀。结论：三种工艺合格率有显著差异。", explain: "卡方检验。" },
{ chapter: "ch7", type: "应用题", q: "某电商平台想比较三种推荐算法的点击率是否有显著差异。算法A、B、C各展示1000次，点击数为100、150、120。请用卡方检验判断（α=0.05，χ²₀.₀₅(2)=5.99）。", refAnswer: "H₀：三种算法点击率相等。总点击率=370/3000≈0.1233。理论频数：点击123.3、123.3、123.3，未点击876.7、876.7、876.7。χ²≈(100-123.3)²/123.3+(150-123.3)²/123.3+(120-123.3)²/123.3+(900-876.7)²/876.7+(850-876.7)²/876.7+(880-876.7)²/876.7≈4.40+5.78+0.09+0.62+0.81+0.01≈11.71。11.71>5.99，拒绝H₀。结论：三种算法点击率有显著差异。", explain: "卡方检验。" },
{ chapter: "ch7", type: "应用题", q: "某电商平台想比较四种推荐算法的点击率是否有显著差异。算法A、B、C、D各测试5天，点击率如下：A: 10,12,11,13,14；B: 15,14,16,15,17；C: 9,10,8,11,12；D: 13,14,12,15,16。请完成方差分析（α=0.05，F₀.₀₅(3,16)=3.24）。", refAnswer: "各组均值：A=12，B=15.4，C=10，D=14，总均值≈12.85。SSA=5×[(12-12.85)²+(15.4-12.85)²+(10-12.85)²+(14-12.85)²]≈5×(0.72+6.50+8.12+1.32)≈83.3。SSE≈24+5+9+10=48。MSA=83.3/3≈27.77，MSE=48/16=3，F≈9.26。9.26>3.24，拒绝H₀。结论：四种算法点击率有显著差异。", explain: "单因素方差分析，四组。" },
{ chapter: "ch7", type: "应用题", q: "某电商平台想比较三种用户群体的平均消费金额是否有显著差异。群体A、B、C各抽5人，消费金额如下：A: 500,520,510,530,540；B: 600,620,610,630,640；C: 400,420,410,430,440。请完成方差分析（α=0.05，F₀.₀₅(2,12)=3.89）。", refAnswer: "各组均值：A=520，B=620，C=420，总均值=520。SSA=5×[(520-520)²+(620-520)²+(420-520)²]=5×(0+10000+10000)=100000。SSE≈(400+0+100+100+400)+(400+0+100+100+400)+(400+0+100+100+400)=1000+1000+1000=3000。MSA=100000/2=50000，MSE=3000/12=250，F=200。200>3.89，拒绝H₀。结论：三种用户群体消费金额有显著差异。", explain: "单因素方差分析。" },
{ chapter: "ch7", type: "应用题", q: "某电商平台想比较三种物流方式的平均配送时间是否有显著差异。物流A、B、C各抽5个包裹，配送时间（天）如下：A: 2,3,2,3,2；B: 4,5,4,5,4；C: 1,2,1,2,1。请完成方差分析（α=0.05，F₀.₀₅(2,12)=3.89）。", refAnswer: "各组均值：A=2.4，B=4.4，C=1.4，总均值≈2.73。SSA=5×[(2.4-2.73)²+(4.4-2.73)²+(1.4-2.73)²]≈5×(0.11+2.79+1.77)≈23.35。SSE≈(0.16+0.36+0.16+0.36+0.16)+(0.16+0.36+0.16+0.36+0.16)+(0.16+0.36+0.16+0.36+0.16)=1.2+1.2+1.2=3.6。MSA=23.35/2≈11.68，MSE=3.6/12=0.3，F≈38.9。38.9>3.89，拒绝H₀。结论：三种物流方式配送时间有显著差异。", explain: "单因素方差分析。" },
{ chapter: "ch7", type: "应用题", q: "某电商平台想比较三种客服响应时间是否有显著差异。客服A、B、C各抽5次，响应时间（秒）如下：A: 30,32,31,33,34；B: 20,22,21,23,24；C: 40,42,41,43,44。请完成方差分析（α=0.05，F₀.₀₅(2,12)=3.89）。", refAnswer: "各组均值：A=32，B=22，C=42，总均值=32。SSA=5×[(32-32)²+(22-32)²+(42-32)²]=5×(0+100+100)=1000。SSE≈(4+0+1+1+4)+(4+0+1+1+4)+(4+0+1+1+4)=10+10+10=30。MSA=1000/2=500，MSE=30/12=2.5，F=200。200>3.89，拒绝H₀。结论：三种客服响应时间有显著差异。", explain: "单因素方差分析。" },
{ chapter: "ch7", type: "应用题", q: "某电商平台想比较三种商品定价策略的销量是否有显著差异。策略A、B、C各测试5天，销量如下：A: 100,110,105,115,120；B: 80,85,82,88,90；C: 120,125,122,128,130。请完成方差分析（α=0.05，F₀.₀₅(2,12)=3.89）。", refAnswer: "各组均值：A=110，B=85，C=125，总均值≈106.67。SSA=5×[(110-106.67)²+(85-106.67)²+(125-106.67)²]≈5×(11.09+469.44+335.99)≈4082.6。SSE≈(100+0+25+25+100)+(25+0+9+9+25)+(25+0+9+9+25)=250+68+68=386。MSA=4082.6/2≈2041.3，MSE=386/12≈32.17，F≈63.5。63.5>3.89，拒绝H₀。结论：三种定价策略销量有显著差异。", explain: "单因素方差分析。" },
{ chapter: "ch7", type: "应用题", q: "某电商平台想比较三种广告投放渠道的转化率是否有显著差异。渠道A、B、C各展示1000次，转化数分别为80、120、100。请用卡方检验判断（α=0.05，χ²₀.₀₅(2)=5.99）。", refAnswer: "H₀：三种渠道转化率相等。总转化率=300/3000=0.1。理论频数：转化100、100、100，未转化900、900、900。χ²=(80-100)²/100+(120-100)²/100+(100-100)²/100+(920-900)²/900+(880-900)²/900+(900-900)²/900=4+4+0+0.44+0.44+0=8.88。8.88>5.99，拒绝H₀。结论：三种渠道转化率有显著差异。", explain: "卡方检验。" },
{ chapter: "ch7", type: "应用题", q: "某电商平台想比较三种优惠券面额的核销率是否有显著差异。面额A、B、C各发放500张，核销数分别为150、200、180。请用卡方检验判断（α=0.05，χ²₀.₀₅(2)=5.99）。", refAnswer: "H₀：三种面额核销率相等。总核销率=530/1500≈0.3533。理论频数：核销176.7、176.7、176.7，未核销323.3、323.3、323.3。χ²≈(150-176.7)²/176.7+(200-176.7)²/176.7+(180-176.7)²/176.7+(350-323.3)²/323.3+(300-323.3)²/323.3+(320-323.3)²/323.3≈4.04+3.07+0.06+2.21+1.68+0.03≈11.09。11.09>5.99，拒绝H₀。结论：三种面额核销率有显著差异。", explain: "卡方检验。" },
{ chapter: "ch7", type: "应用题", q: "某电商平台想比较三种会员等级的复购率是否有显著差异。等级A、B、C各抽200人，复购数分别为80、100、60。请用卡方检验判断（α=0.05，χ²₀.₀₅(2)=5.99）。", refAnswer: "H₀：三种等级复购率相等。总复购率=240/600=0.4。理论频数：复购80、80、80，未复购120、120、120。χ²=(80-80)²/80+(100-80)²/80+(60-80)²/80+(120-120)²/120+(100-120)²/120+(140-120)²/120=0+5+5+0+3.33+3.33=16.67。16.67>5.99，拒绝H₀。结论：三种等级复购率有显著差异。", explain: "卡方检验。" },
{ chapter: "ch7", type: "应用题", q: "某电商平台想比较三种商品类目的退货率是否有显著差异。类目A、B、C各抽500笔，退货数分别为25、50、40。请用卡方检验判断（α=0.05，χ²₀.₀₅(2)=5.99）。", refAnswer: "H₀：三种类目退货率相等。总退货率=115/1500≈0.0767。理论频数：退货38.3、38.3、38.3，未退货461.7、461.7、461.7。χ²≈(25-38.3)²/38.3+(50-38.3)²/38.3+(40-38.3)²/38.3+(475-461.7)²/461.7+(450-461.7)²/461.7+(460-461.7)²/461.7≈4.62+3.57+0.08+0.38+0.30+0.01≈8.96。8.96>5.99，拒绝H₀。结论：三种类目退货率有显著差异。", explain: "卡方检验。" },
{ chapter: "ch7", type: "应用题", q: "某电商平台想比较四种用户来源的转化率是否有显著差异。来源A、B、C、D各展示500次，转化数分别为50、60、40、70。请用卡方检验判断（α=0.05，χ²₀.₀₅(3)=7.81）。", refAnswer: "H₀：四种来源转化率相等。总转化率=220/2000=0.11。理论频数：转化55、55、55、55，未转化445、445、445、445。χ²=(50-55)²/55+(60-55)²/55+(40-55)²/55+(70-55)²/55+(450-445)²/445+(440-445)²/445+(460-445)²/445+(430-445)²/445≈0.45+0.45+4.09+4.09+0.06+0.06+0.51+0.51≈10.22。10.22>7.81，拒绝H₀。结论：四种来源转化率有显著差异。", explain: "卡方检验，四组。" },
{ chapter: "ch7", type: "应用题", q: "某电商平台想比较三种活动形式的参与率是否有显著差异。活动A、B、C各抽300人，参与数分别为60、90、75。请用卡方检验判断（α=0.05，χ²₀.₀₅(2)=5.99）。", refAnswer: "H₀：三种活动参与率相等。总参与率=225/900=0.25。理论频数：参与75、75、75，未参与225、225、225。χ²=(60-75)²/75+(90-75)²/75+(75-75)²/75+(240-225)²/225+(210-225)²/225+(225-225)²/225=3+3+0+1+1+0=8。8>5.99，拒绝H₀。结论：三种活动参与率有显著差异。", explain: "卡方检验。" },
{ chapter: "ch7", type: "应用题", q: "某电商平台想比较三种推荐位的点击率是否有显著差异。推荐位A、B、C各展示800次，点击数分别为80、120、100。请用卡方检验判断（α=0.05，χ²₀.₀₅(2)=5.99）。", refAnswer: "H₀：三种推荐位点击率相等。总点击率=300/2400=0.125。理论频数：点击100、100、100，未点击700、700、700。χ²=(80-100)²/100+(120-100)²/100+(100-100)²/100+(720-700)²/700+(680-700)²/700+(700-700)²/700=4+4+0+0.57+0.57+0=9.14。9.14>5.99，拒绝H₀。结论：三种推荐位点击率有显著差异。", explain: "卡方检验。" },
{ chapter: "ch7", type: "应用题", q: "某电商平台想比较三种用户年龄段的购买率是否有显著差异。年龄段A、B、C各抽400人，购买数分别为80、120、100。请用卡方检验判断（α=0.05，χ²₀.₀₅(2)=5.99）。", refAnswer: "H₀：三种年龄段购买率相等。总购买率=300/1200=0.25。理论频数：购买100、100、100，未购买300、300、300。χ²=(80-100)²/100+(120-100)²/100+(100-100)²/100+(320-300)²/300+(280-300)²/300+(300-300)²/300=4+4+0+1.33+1.33+0=10.67。10.67>5.99，拒绝H₀。结论：三种年龄段购买率有显著差异。", explain: "卡方检验。" },
{ chapter: "ch7", type: "应用题", q: "某电商平台想比较三种商品价格的转化率是否有显著差异。价格A、B、C各展示600次，转化数分别为60、90、75。请用卡方检验判断（α=0.05，χ²₀.₀₅(2)=5.99）。", refAnswer: "H₀：三种价格转化率相等。总转化率=225/1800=0.125。理论频数：转化75、75、75，未转化525、525、525。χ²=(60-75)²/75+(90-75)²/75+(75-75)²/75+(540-525)²/525+(510-525)²/525+(525-525)²/525=3+3+0+0.43+0.43+0=6.86。6.86>5.99，拒绝H₀。结论：三种价格转化率有显著差异。", explain: "卡方检验。" },
{ chapter: "ch7", type: "应用题", q: "某电商平台想比较三种商品评价数的转化率是否有显著差异。评价A、B、C各展示400次，转化数分别为40、60、50。请用卡方检验判断（α=0.05，χ²₀.₀₅(2)=5.99）。", refAnswer: "H₀：三种评价转化率相等。总转化率=150/1200=0.125。理论频数：转化50、50、50，未转化350、350、350。χ²=(40-50)²/50+(60-50)²/50+(50-50)²/50+(360-350)²/350+(340-350)²/350+(350-350)²/350=2+2+0+0.29+0.29+0=4.58。4.58<5.99，不拒绝H₀。结论：三种评价转化率无显著差异。", explain: "卡方检验。" },
{ chapter: "ch7", type: "应用题", q: "某电商平台想比较三种商品图片风格的点击率是否有显著差异。风格A、B、C各展示500次，点击数分别为50、70、60。请用卡方检验判断（α=0.05，χ²₀.₀₅(2)=5.99）。", refAnswer: "H₀：三种风格点击率相等。总点击率=180/1500=0.12。理论频数：点击60、60、60，未点击440、440、440。χ²=(50-60)²/60+(70-60)²/60+(60-60)²/60+(450-440)²/440+(430-440)²/440+(440-440)²/440=1.67+1.67+0+0.23+0.23+0=3.8。3.8<5.99，不拒绝H₀。结论：三种图片风格点击率无显著差异。", explain: "卡方检验。" },
{ chapter: "ch7", type: "应用题", q: "某电商平台想比较三种商品标题的点击率是否有显著差异。标题A、B、C各展示600次，点击数分别为60、90、75。请用卡方检验判断（α=0.05，χ²₀.₀₅(2)=5.99）。", refAnswer: "H₀：三种标题点击率相等。总点击率=225/1800=0.125。理论频数：点击75、75、75，未点击525、525、525。χ²=(60-75)²/75+(90-75)²/75+(75-75)²/75+(540-525)²/525+(510-525)²/525+(525-525)²/525=3+3+0+0.43+0.43+0=6.86。6.86>5.99，拒绝H₀。结论：三种标题点击率有显著差异。", explain: "卡方检验。" },
{ chapter: "ch7", type: "应用题", q: "某电商平台想比较三种商品详情的转化率是否有显著差异。详情A、B、C各展示400次，转化数分别为40、60、50。请用卡方检验判断（α=0.05，χ²₀.₀₅(2)=5.99）。", refAnswer: "H₀：三种详情转化率相等。总转化率=150/1200=0.125。理论频数：转化50、50、50，未转化350、350、350。χ²=(40-50)²/50+(60-50)²/50+(50-50)²/50+(360-350)²/350+(340-350)²/350+(350-350)²/350=2+2+0+0.29+0.29+0=4.58。4.58<5.99，不拒绝H₀。结论：三种详情转化率无显著差异。", explain: "卡方检验。" },

// ===== 简答题 10 题 =====
{ chapter: "ch8", type: "简答题", q: "简述一元线性回归模型的基本形式和各参数含义。", refAnswer: "一元线性回归模型为y=β₀+β₁x+ε，其中β₀为截距，表示x=0时y的期望值；β₁为斜率（回归系数），表示x每增加1单位，y的平均变化量；ε为随机误差项，表示未被模型解释的随机波动。", explain: "一元线性回归模型的形式和参数含义。" },
{ chapter: "ch8", type: "简答题", q: "简述最小二乘法的基本思想。", refAnswer: "最小二乘法通过使残差平方和最小来估计回归系数。残差是实际值与预测值之差，最小二乘法寻找使所有残差平方和最小的β₀和β₁，从而得到最优拟合直线。", explain: "最小二乘法的基本思想。" },
{ chapter: "ch8", type: "简答题", q: "简述决定系数R²的含义和作用。", refAnswer: "R²=SSR/SST，表示回归平方和占总平方和的比例，反映模型对数据的拟合程度。R²取值范围[0,1]，越接近1说明模型解释的变异越多，拟合越好。但R²高不代表因果关系成立。", explain: "R²的含义和作用。" },
{ chapter: "ch8", type: "简答题", q: "简述调整R²与R²的区别。", refAnswer: "R²不考虑自变量个数，增加自变量总会使R²不降；调整R²考虑了自变量个数和样本量，对增加无关自变量进行惩罚，可能下降。因此在多元回归中，调整R²更能反映模型的真实拟合优度。", explain: "调整R²与R²的区别。" },
{ chapter: "ch8", type: "简答题", q: "简述回归分析的基本假设。", refAnswer: "1. 线性关系：自变量与因变量之间是线性关系；2. 残差均值为0；3. 残差方差相等（同方差性）；4. 残差相互独立；5. 残差服从正态分布。这些假设是回归推断有效性的前提。", explain: "回归分析的五条基本假设。" },
{ chapter: "ch8", type: "简答题", q: "简述多重共线性的影响和处理方法。", refAnswer: "影响：使回归系数估计不稳定、标准误增大、系数符号可能反常、显著性检验失效。处理方法：1. 删除相关性高的自变量；2. 使用主成分分析；3. 使用岭回归；4. 增加样本量；5. 使用VIF检测。", explain: "多重共线性的影响和处理。" },
{ chapter: "ch8", type: "简答题", q: "简述异方差的影响和处理方法。", refAnswer: "影响：违反同方差假设，使回归系数标准误估计有偏，t检验和F检验失效。处理方法：1. 变量变换（如对数变换）；2. 加权最小二乘法；3. 使用稳健标准误；4. 通过残差图检测。", explain: "异方差的影响和处理。" },
{ chapter: "ch8", type: "简答题", q: "简述回归分析中异常值的检测和处理。", refAnswer: "检测：1. 标准化残差（|标准化残差|>3视为异常）；2. 学生化残差；3. Cook距离；4. 箱线图。处理：1. 检查数据录入错误；2. 分析异常值产生原因；3. 若为真实异常，可考虑稳健回归或删除，但需谨慎并说明理由。", explain: "异常值的检测和处理。" },
{ chapter: "ch8", type: "简答题", q: "简述逻辑回归与线性回归的区别。", refAnswer: "线性回归用于预测连续数值，因变量为连续型；逻辑回归用于分类问题，因变量为二分类（0/1），通过Sigmoid函数将线性组合映射为概率。线性回归使用最小二乘法，逻辑回归使用最大似然估计。", explain: "逻辑回归与线性回归的区别。" },
{ chapter: "ch8", type: "简答题", q: "简述回归分析在智能决策中的应用。", refAnswer: "回归分析用于预测和解释变量关系，如销量预测、风险评估、用户行为分析。在智能决策中，回归模型可量化各因素的影响，支持资源分配和策略优化。结合AI工具，可自动化建模和预测，为数据驱动决策提供依据，同时需注意模型假设和可解释性。", explain: "回归分析在智能决策中的应用。" },

// ===== 应用题 30 题 =====
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析广告投入对销售额的影响。已知回归方程为 y=100+5x，其中x为广告投入（万元），y为销售额（万元）。请解释回归系数的含义，并预测广告投入10万元时的销售额。", refAnswer: "β₁=5表示广告投入每增加1万元，销售额平均增加5万元；β₀=100表示无广告投入时销售额约为100万元。当x=10时，y=100+5×10=150万元。", explain: "回归系数的解释和预测。" },
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析用户年龄对消费金额的影响。已知回归方程为 y=200+10x，其中x为年龄，y为消费金额（元）。请解释回归系数，并预测30岁用户的消费金额。", refAnswer: "β₁=10表示年龄每增加1岁，消费金额平均增加10元；β₀=200表示年龄为0时的基准消费（无实际意义）。当x=30时，y=200+10×30=500元。", explain: "回归系数解释和预测。" },
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析价格对销量的影响。已知回归方程为 y=500-2x，其中x为价格（元），y为销量（件）。请解释回归系数，并预测价格100元时的销量。", refAnswer: "β₁=-2表示价格每增加1元，销量平均减少2件；β₀=500表示价格为0时的基准销量。当x=100时，y=500-2×100=300件。", explain: "负回归系数的解释。" },
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析促销次数对销售额的影响。已知回归方程为 y=1000+200x，R²=0.85，其中x为促销次数，y为销售额。请解释R²的含义。", refAnswer: "R²=0.85表示销售额变异的85%可以由促销次数解释，模型拟合较好。剩余15%由其他因素（如季节、竞品、价格等）解释。", explain: "R²的解释。" },
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析用户年龄、收入对消费金额的影响。已知多元回归方程为 y=100+5x₁+10x₂，其中x₁为年龄，x₂为收入（千元）。请解释各回归系数。", refAnswer: "β₁=5表示在收入不变时，年龄每增加1岁，消费金额平均增加5元；β₂=10表示在年龄不变时，收入每增加1千元，消费金额平均增加10元。", explain: "多元回归系数的解释。" },
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析广告投入、促销次数对销售额的影响。已知多元回归方程为 y=500+3x₁+8x₂，R²=0.9，调整R²=0.88。请解释调整R²的含义。", refAnswer: "调整R²=0.88考虑了自变量个数，说明在惩罚无关变量后，模型仍能解释88%的销售额变异，模型拟合较好且稳健。", explain: "调整R²的解释。" },
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析价格、广告对销量的影响。已知回归方程为 y=1000-5x₁+3x₂，其中x₁为价格，x₂为广告投入。请解释回归系数。", refAnswer: "β₁=-5表示在广告投入不变时，价格每增加1元，销量平均减少5件；β₂=3表示在价格不变时，广告投入每增加1万元，销量平均增加3件。", explain: "多元回归系数解释。" },
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析用户年龄对消费金额的影响。已知回归方程为 y=200+10x，R²=0.6。请判断模型拟合是否理想，并说明原因。", refAnswer: "R²=0.6表示消费金额变异的60%可以由年龄解释，拟合中等。剩余40%由其他因素解释。若需更好预测，应加入更多自变量（如收入、性别、消费频次等）。", explain: "R²的评估。" },
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析价格对销量的影响。已知回归方程为 y=500-2x，R²=0.8。请判断价格与销量的关系强度和方向。", refAnswer: "R²=0.8说明价格能解释80%的销量变异，关系较强；β₁=-2说明价格与销量负相关，价格越高销量越低。", explain: "回归系数和R²的综合解释。" },
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析用户年龄、收入、消费频次对消费金额的影响。已知回归方程R²=0.92，调整R²=0.91。请解释两者的差异。", refAnswer: "R²=0.92说明模型解释92%的变异；调整R²=0.91考虑了自变量个数，仅略低于R²，说明三个自变量都对模型有贡献，没有过多无关变量，模型稳健。", explain: "R²与调整R²的对比。" },
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析广告投入对销售额的影响。已知回归方程y=100+5x，R²=0.9。请解释回归系数和R²，并说明预测的可靠性。", refAnswer: "β₁=5表示广告每增加1万元，销售额平均增加5万元；R²=0.9说明广告能解释90%的销售额变异，模型拟合很好，预测较可靠。但需注意相关不等于因果，且预测区间仍有不确定性。", explain: "回归系数、R²与预测可靠性。" },
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析价格对销量的影响。已知回归方程y=500-2x，R²=0.8，样本量n=50。请计算回归系数的标准误（假设SSE=1000，Sxx=200）。", refAnswer: "MSE=SSE/(n-2)=1000/48≈20.83；标准误=√(MSE/Sxx)=√(20.83/200)≈0.323。", explain: "回归系数标准误的计算。" },
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析价格对销量的影响。已知回归方程y=500-2x，回归系数标准误为0.5。请计算t统计量并判断是否显著（α=0.05，t₀.₀₂₅(48)=2.011）。", refAnswer: "t=-2/0.5=-4；|t|=4>2.011，拒绝H₀。结论：价格对销量有显著影响。", explain: "回归系数显著性检验。" },
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析广告投入对销售额的影响。已知回归方程y=100+5x，回归系数标准误为1.5。请计算t统计量并判断是否显著（α=0.05，t₀.₀₂₅(48)=2.011）。", refAnswer: "t=5/1.5≈3.33；|t|=3.33>2.011，拒绝H₀。结论：广告投入对销售额有显著影响。", explain: "回归系数显著性检验。" },
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析年龄对消费金额的影响。已知回归方程y=200+10x，回归系数标准误为4。请计算t统计量并判断是否显著（α=0.05，t₀.₀₂₅(48)=2.011）。", refAnswer: "t=10/4=2.5；|t|=2.5>2.011，拒绝H₀。结论：年龄对消费金额有显著影响。", explain: "回归系数显著性检验。" },
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析收入对消费金额的影响。已知回归方程y=100+5x，回归系数标准误为3。请计算t统计量并判断是否显著（α=0.05，t₀.₀₂₅(48)=2.011）。", refAnswer: "t=5/3≈1.67；|t|=1.67<2.011，不拒绝H₀。结论：收入对消费金额无显著影响。", explain: "回归系数不显著的判断。" },
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析广告投入对销售额的影响。已知回归方程y=100+5x，SSR=5000，SST=6000。请计算R²并解释。", refAnswer: "R²=SSR/SST=5000/6000≈0.833。说明广告投入能解释83.3%的销售额变异，模型拟合较好。", explain: "R²的计算。" },
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析价格对销量的影响。已知回归方程y=500-2x，SSR=4000，SST=5000。请计算R²并解释。", refAnswer: "R²=4000/5000=0.8。说明价格能解释80%的销量变异，模型拟合较好。", explain: "R²的计算。" },
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析用户年龄、收入对消费金额的影响。已知R²=0.9，n=50，k=2。请计算调整R²。", refAnswer: "调整R²=1-(1-R²)(n-1)/(n-k-1)=1-(1-0.9)×49/47≈1-0.1×1.043≈0.896。", explain: "调整R²的计算。" },
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析用户年龄、收入、消费频次对消费金额的影响。已知R²=0.85，n=100，k=3。请计算调整R²。", refAnswer: "调整R²=1-(1-0.85)×99/96≈1-0.15×1.031≈0.845。", explain: "调整R²的计算。" },
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析广告投入对销售额的影响。已知回归方程y=100+5x，SSE=1000，n=50，Sxx=200。请计算回归系数的95%置信区间（t₀.₀₂₅(48)=2.011）。", refAnswer: "标准误=√(MSE/Sxx)=√(1000/48/200)≈0.323；置信区间=5±2.011×0.323=5±0.649=[4.351, 5.649]。", explain: "回归系数置信区间。" },
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析价格对销量的影响。已知回归方程y=500-2x，SSE=1000，n=50，Sxx=200。请计算回归系数的95%置信区间（t₀.₀₂₅(48)=2.011）。", refAnswer: "标准误=√(1000/48/200)≈0.323；置信区间=-2±2.011×0.323=-2±0.649=[-2.649, -1.351]。", explain: "回归系数置信区间。" },
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析广告投入对销售额的影响。已知回归方程y=100+5x，请预测广告投入20万元时的销售额，并说明预测的不确定性。", refAnswer: "预测值=100+5×20=200万元。预测存在不确定性，实际销售额可能因季节、竞品、促销等因素偏离预测值。可用预测区间量化不确定性。", explain: "预测及不确定性说明。" },
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析价格对销量的影响。已知回归方程y=500-2x，请预测价格150元时的销量，并说明预测的合理性。", refAnswer: "预测值=500-2×150=200件。预测合理性取决于价格是否在建模数据范围内，若150元远超历史价格范围，预测可能不可靠（外推风险）。", explain: "预测及外推风险。" },
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析广告投入对销售额的影响。已知回归方程R²=0.9，但残差图显示异方差。请说明异方差的影响和处理方法。", refAnswer: "异方差使回归系数标准误估计有偏，t检验和F检验失效。处理方法：1. 对数变换；2. 加权最小二乘法；3. 使用稳健标准误。", explain: "异方差的影响和处理。" },
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析用户年龄、收入对消费金额的影响。已知VIF分别为8和12。请判断是否存在多重共线性并说明处理方法。", refAnswer: "VIF=12>10说明收入变量存在严重多重共线性；VIF=8接近10，需关注。处理方法：删除相关性高的变量、使用主成分分析、使用岭回归。", explain: "多重共线性的判断和处理。" },
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析广告投入对销售额的影响。已知回归方程y=100+5x，R²=0.9，但样本量仅为10。请说明样本量对回归分析的影响。", refAnswer: "样本量过小会导致：1. 回归系数估计不稳定；2. 标准误增大；3. 检验功效低；4. 过拟合风险高。建议增加样本量，一般要求每个自变量至少10-20个观测。", explain: "样本量对回归分析的影响。" },
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析广告投入对销售额的影响。已知回归方程y=100+5x，R²=0.9。请说明R²高是否意味着因果关系成立。", refAnswer: "R²高只说明模型拟合好，不代表因果关系成立。可能存在遗漏变量、反向因果或虚假相关。要建立因果关系，需结合实验设计（如A/B测试）或因果推断方法。", explain: "相关不等于因果。" },
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析广告投入对销售额的影响。已知回归方程y=100+5x，R²=0.9。请说明如何用该模型进行智能决策。", refAnswer: "1. 预测：给定广告投入预测销售额；2. 优化：在预算约束下求最优广告投入；3. 评估：比较不同广告策略的效果；4. 监控：跟踪实际与预测的偏差；5. 审视：考虑可解释性和决策责任，避免过度依赖模型。", explain: "回归分析在智能决策中的应用。" },
{ chapter: "ch8", type: "应用题", q: "某电商平台想分析广告投入对销售额的影响。已知回归方程y=100+5x，R²=0.9。请说明模型的局限性。", refAnswer: "1. 假设线性关系，可能不符合实际；2. 忽略其他变量影响；3. 外推风险；4. 相关不等于因果；5. 模型基于历史数据，未来可能失效；6. R²高不代表预测一定准确。", explain: "回归模型的局限性。" },
  

// ==================== 第9章 机器学习与智能决策（160题） ====================

// ===== 填空题 40 题 =====
{ chapter: "ch9", type: "填空题", q: "让计算机从数据中自动学习规律的方法称为______。", blanks: ["机器学习"], explain: "机器学习是让计算机从数据中学习规律。" },
{ chapter: "ch9", type: "填空题", q: "机器学习中，有标签数据的学习称为______学习。", blanks: ["监督"], explain: "监督学习使用有标签数据。" },
{ chapter: "ch9", type: "填空题", q: "机器学习中，无标签数据的学习称为______学习。", blanks: ["无监督"], explain: "无监督学习使用无标签数据。" },
{ chapter: "ch9", type: "填空题", q: "监督学习分为______和______两大类任务。", blanks: ["分类", "回归"], explain: "监督学习分为分类和回归。" },
{ chapter: "ch9", type: "填空题", q: "预测离散类别标签的任务称为______。", blanks: ["分类"], explain: "分类预测离散类别。" },
{ chapter: "ch9", type: "填空题", q: "预测连续数值的任务称为______。", blanks: ["回归"], explain: "回归预测连续数值。" },
{ chapter: "ch9", type: "填空题", q: "将相似样本归为一组的任务称为______。", blanks: ["聚类"], explain: "聚类将相似样本分组。" },
{ chapter: "ch9", type: "填空题", q: "用于训练模型的数据集称为______集。", blanks: ["训练"], explain: "训练集用于训练模型。" },
{ chapter: "ch9", type: "填空题", q: "用于评估模型性能的数据集称为______集。", blanks: ["测试"], explain: "测试集用于评估模型。" },
{ chapter: "ch9", type: "填空题", q: "用于调整模型参数的数据集称为______集。", blanks: ["验证"], explain: "验证集用于调参。" },

];

// ==================== 状态 ====================
var state = {
  questions: [],      // 本次抽到的题目
  current: 0,         // 当前题号索引
  answers: [],        // 每题的用户答案：单选/判断存索引，多选存数组，填空存数组，简答存字符串
  locked: [],         // 每题是否已提交
  mode: 'practice'
};

// ==================== 工具 ====================
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function getChapterName(ch) {
  var map = {
    ch1: "第1章 统计与数据基础", ch2: "第2章 描述性统计",
    ch3: "第3章 概率与分布", ch4: "第4章 抽样分布与中心极限定理",
    ch5: "第5章 参数估计", ch6: "第6章 假设检验",
    ch7: "第7章 方差分析", ch8: "第8章 回归分析",
    ch9: "第9章 机器学习与智能决策"
  };
  return map[ch] || ch;
}

// 判断题型分类
function isChoiceType(t) { return t === '单选题' || t === '多选题' || t === '判断题'; }
function isFillType(t) { return t === '填空题'; }
function isTextType(t) { return t === '简答题' || t === '计算题' || t === '应用题'; }

// ==================== 初始化 ====================
function initSetup() {
  document.getElementById('totalCount').textContent = QUESTION_BANK.length;
}

// ==================== 开始练习 ====================
function startQuiz() {
  var chapter = document.getElementById('chapterSelect').value;
  var typeFilter = document.getElementById('typeSelect').value;
  var num = parseInt(document.getElementById('numQuestions').value) || 10;
  state.mode = document.getElementById('modeSelect').value;

  var pool = QUESTION_BANK.filter(function(q) {
    var matchChapter = (chapter === 'all' || q.chapter === chapter);
    var matchType = (typeFilter === 'all' || q.type === typeFilter);
    return matchChapter && matchType;
  });

  if (pool.length === 0) {
    alert('该筛选条件下暂无题目，请调整章节或题型。');
    return;
  }
  if (num > pool.length) num = pool.length;

  state.questions = shuffle(pool).slice(0, num);
  state.current = 0;
  state.answers = new Array(state.questions.length).fill(null);
  state.locked = new Array(state.questions.length).fill(false);

  // 初始化答案结构
  for (var i = 0; i < state.questions.length; i++) {
    var q = state.questions[i];
    if (q.type === '多选题') state.answers[i] = [];
    else if (q.type === '填空题') state.answers[i] = [];
    else if (isTextType(q.type)) state.answers[i] = '';
    else state.answers[i] = -1;
  }

  document.getElementById('setupPanel').classList.add('hidden');
  document.getElementById('resultPanel').classList.add('hidden');
  document.getElementById('quizPanel').classList.remove('hidden');

  renderQuestion();
}

// ==================== 渲染当前题目 ====================
function renderQuestion() {
  var idx = state.current;
  var q = state.questions[idx];
  var total = state.questions.length;

  document.getElementById('qChapter').textContent = getChapterName(q.chapter);
  document.getElementById('qType').textContent = q.type;
  document.getElementById('qIndex').textContent = idx + 1;
  document.getElementById('qTotal').textContent = total;
  document.getElementById('progressFill').style.width = (idx / total * 100) + '%';
  document.getElementById('qText').textContent = (idx + 1) + '. ' + q.q;

  var area = document.getElementById('answerArea');
  area.innerHTML = '';

  var feedback = document.getElementById('feedback');
  feedback.className = 'feedback';
  feedback.innerHTML = '';

  var submitBtn = document.getElementById('submitBtn');
  var nextBtn = document.getElementById('nextBtn');
  var locked = state.locked[idx];

  // 按题型渲染
  if (q.type === '单选题' || q.type === '判断题') {
    renderSingleChoice(area, q, idx, locked);
  } else if (q.type === '多选题') {
    renderMultiChoice(area, q, idx, locked);
  } else if (q.type === '填空题') {
    renderFillBlank(area, q, idx, locked);
  } else if (isTextType(q.type)) {
    renderTextAnswer(area, q, idx, locked);
  }

  if (locked) {
    markAnswer(idx);
    submitBtn.classList.add('hidden');
    nextBtn.classList.remove('hidden');
    if (idx === total - 1) nextBtn.textContent = '查看结果';
    else nextBtn.textContent = '下一题';
  } else {
    submitBtn.classList.remove('hidden');
    submitBtn.disabled = !hasAnswer(idx);
    nextBtn.classList.add('hidden');
  }
}

// 判断当前题是否已作答
function hasAnswer(idx) {
  var q = state.questions[idx];
  var a = state.answers[idx];
  if (q.type === '多选题') return a && a.length > 0;
  if (q.type === '填空题') return a && a.some(function(x) { return x && x.trim() !== ''; });
  if (isTextType(q.type)) return a && a.trim() !== '';
  return a !== -1 && a !== null;
}

// ---------- 单选/判断题 ----------
function renderSingleChoice(area, q, idx, locked) {
  var labels = ['A', 'B', 'C', 'D', 'E', 'F'];
  var ul = document.createElement('ul');
  ul.className = 'options';
  ul.id = 'optionsList';

  q.options.forEach(function(opt, i) {
    var li = document.createElement('li');
    li.dataset.index = i;
    li.innerHTML = '<span class="opt-label">' + labels[i] + '</span><span>' + opt + '</span>';
    if (!locked) {
      li.addEventListener('click', function() { selectSingle(i); });
    }
    if (state.answers[idx] === i) li.classList.add('selected');
    ul.appendChild(li);
  });
  area.appendChild(ul);
}

function selectSingle(i) {
  var idx = state.current;
  if (state.locked[idx]) return;
  state.answers[idx] = i;
  var ul = document.getElementById('optionsList');
  for (var k = 0; k < ul.children.length; k++) {
    ul.children[k].classList.toggle('selected', k === i);
  }
  document.getElementById('submitBtn').disabled = false;
}

// ---------- 多选题 ----------
function renderMultiChoice(area, q, idx, locked) {
  var labels = ['A', 'B', 'C', 'D', 'E', 'F'];
  var tip = document.createElement('div');
  tip.style.cssText = 'font-size:13px;color:#7f8c8d;margin-bottom:10px;';
  tip.textContent = '（多选题，可选择多个选项）';
  area.appendChild(tip);

  var ul = document.createElement('ul');
  ul.className = 'options';
  ul.id = 'optionsList';

  q.options.forEach(function(opt, i) {
    var li = document.createElement('li');
    li.dataset.index = i;
    li.innerHTML = '<span class="opt-label">' + labels[i] + '</span><span>' + opt + '</span>';
    if (!locked) {
      li.addEventListener('click', function() { selectMulti(i); });
    }
    if (state.answers[idx].indexOf(i) !== -1) li.classList.add('selected');
    ul.appendChild(li);
  });
  area.appendChild(ul);
}

function selectMulti(i) {
  var idx = state.current;
  if (state.locked[idx]) return;
  var arr = state.answers[idx];
  var pos = arr.indexOf(i);
  if (pos === -1) arr.push(i);
  else arr.splice(pos, 1);

  var ul = document.getElementById('optionsList');
  for (var k = 0; k < ul.children.length; k++) {
    ul.children[k].classList.toggle('selected', arr.indexOf(k) !== -1);
  }
  document.getElementById('submitBtn').disabled = arr.length === 0;
}

// ---------- 填空题 ----------
function renderFillBlank(area, q, idx, locked) {
  var blanks = q.blanks || [];
  var userAns = state.answers[idx] || [];
  // 按题干中 ______ 的数量确定空位数（兼容一空多答）
  var slotCount = (q.q.match(/______/g) || []).length;
  if (slotCount === 0) slotCount = blanks.length;

  var tip = document.createElement('div');
  tip.style.cssText = 'font-size:13px;color:#7f8c8d;margin-bottom:10px;';
  tip.textContent = '（填空题，共 ' + slotCount + ' 个空，请按顺序填写）';
  area.appendChild(tip);

  for (var i = 0; i < slotCount; i++) {
    var wrap = document.createElement('div');
    wrap.style.cssText = 'margin-bottom:10px;';
    var label = document.createElement('span');
    label.textContent = '第 ' + (i + 1) + ' 空：';
    label.style.cssText = 'font-size:14px;color:#34495e;margin-right:8px;';
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'fill-input';
    inp.dataset.index = i;
    inp.value = userAns[i] || '';
    inp.disabled = locked;
    if (!locked) {
      inp.addEventListener('input', function() {
        var pos = parseInt(this.dataset.index);
        state.answers[idx][pos] = this.value;
        document.getElementById('submitBtn').disabled = !hasAnswer(idx);
      });
    }
    wrap.appendChild(label);
    wrap.appendChild(inp);
    area.appendChild(wrap);
  }
}

// ---------- 简答/计算/应用题 ----------
function renderTextAnswer(area, q, idx, locked) {
  var tip = document.createElement('div');
  tip.style.cssText = 'font-size:13px;color:#7f8c8d;margin-bottom:10px;';
  tip.textContent = '（' + q.type + '，请写出你的解答过程）';
  area.appendChild(tip);

  var ta = document.createElement('textarea');
  ta.className = 'text-area';
  ta.placeholder = '请在此作答……';
  ta.value = state.answers[idx] || '';
  ta.disabled = locked;
  if (!locked) {
    ta.addEventListener('input', function() {
      state.answers[idx] = this.value;
      document.getElementById('submitBtn').disabled = !hasAnswer(idx);
    });
  }
  area.appendChild(ta);
}

// ==================== 提交答案 ====================
function submitAnswer() {
  var idx = state.current;
  if (!hasAnswer(idx)) return;
  state.locked[idx] = true;

  // 重新渲染，把输入控件设为 disabled
  renderQuestion();
  markAnswer(idx);

  document.getElementById('submitBtn').classList.add('hidden');
  var nextBtn = document.getElementById('nextBtn');
  nextBtn.classList.remove('hidden');
  if (idx === state.questions.length - 1) nextBtn.textContent = '查看结果';
  else nextBtn.textContent = '下一题';

  if (state.mode === 'exam') {
    document.getElementById('feedback').classList.remove('show');
  }
}

// ==================== 标记答案对错 ====================
function markAnswer(idx) {
  var q = state.questions[idx];
  var feedback = document.getElementById('feedback');

  if (q.type === '单选题' || q.type === '判断题') {
    markSingle(idx, q, feedback);
  } else if (q.type === '多选题') {
    markMulti(idx, q, feedback);
  } else if (q.type === '填空题') {
    markFill(idx, q, feedback);
  } else if (isTextType(q.type)) {
    markText(idx, q, feedback);
  }
}

// 单选/判断判分
function markSingle(idx, q, feedback) {
  var userAns = state.answers[idx];
  var ul = document.getElementById('optionsList');
  var labels = ['A', 'B', 'C', 'D', 'E', 'F'];

  for (var k = 0; k < ul.children.length; k++) {
    ul.children[k].classList.remove('selected');
    ul.children[k].classList.add('disabled');
  }
  if (userAns === q.answer) {
    ul.children[userAns].classList.add('correct');
  } else {
    if (userAns >= 0) ul.children[userAns].classList.add('wrong');
    ul.children[q.answer].classList.add('correct');
  }

  if (state.mode === 'practice') {
    var isCorrect = userAns === q.answer;
    feedback.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
    feedback.innerHTML =
      '<div class="answer-line">' + (isCorrect ? '✓ 回答正确！' : '✗ 回答错误') + '</div>' +
      '<div class="answer-line">正确答案：' + labels[q.answer] + '. ' + q.options[q.answer] + '</div>' +
      '<div class="explain">解析：' + (q.explain || '') + '</div>';
  }
}

// 多选判分
function markMulti(idx, q, feedback) {
  var userAns = state.answers[idx].slice().sort();
  var correct = q.answer.slice().sort();
  var isCorrect = userAns.length === correct.length &&
                  userAns.every(function(v, i) { return v === correct[i]; });

  var ul = document.getElementById('optionsList');
  var labels = ['A', 'B', 'C', 'D', 'E', 'F'];

  for (var k = 0; k < ul.children.length; k++) {
    ul.children[k].classList.remove('selected');
    ul.children[k].classList.add('disabled');
    var inUser = userAns.indexOf(k) !== -1;
    var inCorrect = correct.indexOf(k) !== -1;
    if (inCorrect) ul.children[k].classList.add('correct');
    else if (inUser) ul.children[k].classList.add('wrong');
  }

  if (state.mode === 'practice') {
    var correctText = correct.map(function(i) { return labels[i]; }).join('、');
    feedback.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
    feedback.innerHTML =
      '<div class="answer-line">' + (isCorrect ? '✓ 回答正确！' : '✗ 回答错误') + '</div>' +
      '<div class="answer-line">正确答案：' + correctText + '</div>' +
      '<div class="explain">解析：' + (q.explain || '') + '</div>';
  }
}

// 填空判分
function markFill(idx, q, feedback) {
  var userAns = state.answers[idx] || [];
  var blanks = q.blanks || [];
  var results = [];
  var allCorrect = true;

var slotCount = (q.q.match(/______/g) || []).length;
  if (slotCount === 0) slotCount = blanks.length;
  for (var i = 0; i < slotCount; i++) {
    var ua = (userAns[i] || '').trim();
    var ok;
    if (Array.isArray(blanks[i])) {
      // 标准格式：该空有多个可接受答案
      ok = blanks[i].some(function(c) { return String(c).trim() === ua; });
    } else if (blanks.length > slotCount && slotCount === 1) {
      // 兼容格式：1个空配多个并列答案（如 ["定性","分类"]），任一即对
      ok = blanks.some(function(c) { return String(c).trim() === ua; });
    } else {
      ok = (ua === String(blanks[i] === undefined ? '' : blanks[i]).trim());
    }
    results.push(ok);
    if (!ok) allCorrect = false;
  }

  // 给输入框上色
  var inputs = document.querySelectorAll('.fill-input');
  for (var j = 0; j < inputs.length; j++) {
    inputs[j].disabled = true;
    if (results[j]) inputs[j].classList.add('correct');
    else inputs[j].classList.add('wrong');
  }

  if (state.mode === 'practice') {
    feedback.className = 'feedback show ' + (allCorrect ? 'correct' : 'wrong');
    var html = '<div class="answer-line">' + (allCorrect ? '✓ 全部正确！' : '✗ 部分或全部错误') + '</div>';
    html += '<div class="answer-line">正确答案：' + blanks.join('、') + '</div>';
    html += '<div class="explain">解析：' + (q.explain || '') + '</div>';
    feedback.innerHTML = html;
  }
}

// 简答/计算/应用判分（自评）
function markText(idx, q, feedback) {
  var userAns = state.answers[idx] || '';
  var ta = document.querySelector('.text-area');
  if (ta) ta.disabled = true;

  feedback.className = 'feedback show info';
  var html = '<div class="answer-line">参考答案：</div>';
  html += '<div class="ref-answer">' + (q.refAnswer || '') + '</div>';
  html += '<div class="explain" style="margin-top:10px;">解析：' + (q.explain || '') + '</div>';
  html += '<div style="margin-top:14px; text-align:center;">';
  html += '<span style="font-size:13px;color:#555;">请自评：</span>';
  html += '<button class="btn green" style="padding:6px 16px;font-size:13px;margin:0 6px;" onclick="selfEval(' + idx + ', true)">我答对了</button>';
  html += '<button class="btn gray" style="padding:6px 16px;font-size:13px;margin:0 6px;" onclick="selfEval(' + idx + ', false)">我答错了</button>';
  html += '</div>';
  feedback.innerHTML = html;

  // 如果已经自评过，显示结果
  if (q._selfEval !== undefined) {
    var tip = document.createElement('div');
    tip.style.cssText = 'margin-top:8px;font-size:13px;color:' + (q._selfEval ? '#27ae60' : '#e74c3c') + ';';
    tip.textContent = q._selfEval ? '已标记：答对' : '已标记：答错';
    feedback.appendChild(tip);
  }
}

// 自评回调
function selfEval(idx, isCorrect) {
  state.questions[idx]._selfEval = isCorrect;
  var feedback = document.getElementById('feedback');
  var tip = document.createElement('div');
  tip.style.cssText = 'margin-top:8px;font-size:13px;color:' + (isCorrect ? '#27ae60' : '#e74c3c') + ';';
  tip.textContent = isCorrect ? '已标记：答对' : '已标记：答错';
  // 清除旧标记
  var old = feedback.querySelectorAll('div[style*="margin-top:8px"]');
  for (var i = 0; i < old.length; i++) old[i].remove();
  feedback.appendChild(tip);
}

// ==================== 下一题 ====================
function nextQuestion() {
  if (state.current < state.questions.length - 1) {
    state.current++;
    renderQuestion();
  } else {
    showResult();
  }
}

// ==================== 判分：每题是否答对 ====================
function isQuestionCorrect(idx) {
  var q = state.questions[idx];
  var a = state.answers[idx];

  if (q.type === '单选题' || q.type === '判断题') {
    return a === q.answer;
  }
  if (q.type === '多选题') {
    var ua = (a || []).slice().sort();
    var ca = q.answer.slice().sort();
    return ua.length === ca.length && ua.every(function(v, i) { return v === ca[i]; });
  }
  if (q.type === '填空题') {
    var blanks = q.blanks || [];
    if (!a || a.length !== blanks.length) return false;
    for (var i = 0; i < blanks.length; i++) {
      if ((a[i] || '').trim() !== String(blanks[i]).trim()) return false;
    }
    return true;
  }
  // 简答/计算/应用：以自评为准
  return q._selfEval === true;
}

// 判断题是否已作答（用于统计）
function isQuestionAnswered(idx) {
  var q = state.questions[idx];
  if (isTextType(q.type)) return q._selfEval !== undefined;
  return hasAnswer(idx);
}

// ==================== 显示结果 ====================
function showResult() {
  document.getElementById('quizPanel').classList.add('hidden');
  document.getElementById('resultPanel').classList.remove('hidden');

  var total = state.questions.length;
  var correct = 0;
  for (var i = 0; i < total; i++) {
    if (isQuestionCorrect(i)) correct++;
  }
  var wrong = total - correct;
  var rate = total > 0 ? Math.round(correct / total * 100) : 0;

  document.getElementById('resTotal').textContent = total;
  document.getElementById('resCorrect').textContent = correct;
  document.getElementById('resWrong').textContent = wrong;
  document.getElementById('resRate').textContent = rate + '%';

  // 错题回顾
  var reviewList = document.getElementById('reviewList');
  reviewList.innerHTML = '';
  var labels = ['A', 'B', 'C', 'D', 'E', 'F'];

  for (var i = 0; i < state.questions.length; i++) {
    if (isQuestionCorrect(i)) continue;
    var q = state.questions[i];
    var item = document.createElement('div');
    item.className = 'review-item';

    var userText = '';
    var correctText = '';

    if (q.type === '单选题' || q.type === '判断题') {
      userText = state.answers[i] >= 0 ? labels[state.answers[i]] + '. ' + q.options[state.answers[i]] : '未作答';
      correctText = labels[q.answer] + '. ' + q.options[q.answer];
    } else if (q.type === '多选题') {
      var ua = state.answers[i] || [];
      userText = ua.length ? ua.map(function(k) { return labels[k]; }).join('、') : '未作答';
      correctText = q.answer.map(function(k) { return labels[k]; }).join('、');
    } else if (q.type === '填空题') {
      userText = (state.answers[i] || []).join('、') || '未作答';
      correctText = (q.blanks || []).join('、');
    } else {
      userText = (state.answers[i] || '').trim() || '未作答';
      correctText = q.refAnswer || '';
    }

    item.innerHTML =
      '<div class="rq">' + (i + 1) + '. [' + q.type + '] ' + q.q + '</div>' +
      '<div>你的答案：<span style="color:#e74c3c;">' + userText + '</span></div>' +
      '<div class="ra">正确答案：' + correctText + '</div>' +
      '<div class="rx">解析：' + (q.explain || '') + '</div>';
    reviewList.appendChild(item);
  }
  if (reviewList.children.length === 0) {
    reviewList.innerHTML = '<div style="color:#27ae60; padding:12px;">全部答对，无错题！</div>';
  }
}

// ==================== 退出练习 ====================
function quitQuiz() {
  if (confirm('确定退出本次练习吗？')) {
    document.getElementById('quizPanel').classList.add('hidden');
    document.getElementById('resultPanel').classList.add('hidden');
    document.getElementById('setupPanel').classList.remove('hidden');
  }
}

// ==================== 返回设置 ====================
function backToSetup() {
  document.getElementById('resultPanel').classList.add('hidden');
  document.getElementById('setupPanel').classList.remove('hidden');
}

// ==================== 事件绑定 ====================
function bindEvents() {
  document.getElementById('startBtn').addEventListener('click', startQuiz);
  document.getElementById('submitBtn').addEventListener('click', submitAnswer);
  document.getElementById('nextBtn').addEventListener('click', nextQuestion);
  document.getElementById('quitBtn').addEventListener('click', quitQuiz);
  document.getElementById('restartBtn').addEventListener('click', startQuiz);
  document.getElementById('backBtn').addEventListener('click', backToSetup);

  document.getElementById('typeSelect').addEventListener('change', function() {
    document.getElementById('totalCount').textContent = QUESTION_BANK.length;
  });  
99}

// ==================== 初始化 ====================
window.addEventListener('load', function() {
  var total = QUESTION_BANK.length;
  document.getElementById('totalCount').textContent = total;
  console.log('题库总数：', total);
  bindEvents();
});

</script>
