<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>智能统计分析与决策 · 抽题练习系统</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: #f0f3f8; color: #2c3e50; }
  h1 { font-size: 22px; text-align: center; margin-bottom: 4px; }
  .subtitle { text-align: center; color: #7f8c8d; font-size: 13px; margin-bottom: 20px; }
  .panel { background: #fff; border-radius: 12px; padding: 20px 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 16px; }
  .panel h3 { font-size: 15px; color: #34495e; margin: 0 0 14px 0; padding-bottom: 8px; border-bottom: 2px solid #ecf0f1; }
  .setup-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .setup-row label { font-size: 14px; color: #34495e; }
  .setup-row select, .setup-row input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; }
  .setup-row select { flex: 1; min-width: 180px; }
  .setup-row input[type="number"] { width: 90px; }
  .btn { background: #3498db; color: #fff; border: none; padding: 10px 24px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold; transition: background 0.2s; margin: 4px 4px 4px 0; }
  .btn:hover { background: #2980b9; }
  .btn.green { background: #27ae60; }
  .btn.green:hover { background: #219150; }
  .btn.orange { background: #e67e22; }
  .btn.orange:hover { background: #d35400; }
  .btn.gray { background: #95a5a6; }
  .btn.gray:hover { background: #7f8c8d; }
  .btn:disabled { background: #bdc3c7; cursor: not-allowed; }
  .progress-bar { height: 8px; background: #ecf0f1; border-radius: 4px; margin: 12px 0; overflow: hidden; }
  .progress-bar .fill { height: 100%; background: linear-gradient(90deg, #3498db, #27ae60); width: 0%; transition: width 0.3s; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #7f8c8d; margin-bottom: 10px; }
  .q-meta .chapter-tag { background: #eaf2f8; color: #2980b9; padding: 3px 10px; border-radius: 12px; font-size: 12px; }
  .q-meta .type-tag { background: #fef5e7; color: #b9770e; padding: 3px 10px; border-radius: 12px; font-size: 12px; margin-left: 6px; }
  .q-text { font-size: 16px; line-height: 1.7; margin: 14px 0 18px 0; color: #2c3e50; }
  .options { list-style: none; padding: 0; margin: 0; }
  .options li { padding: 12px 16px; margin-bottom: 10px; border: 2px solid #ecf0f1; border-radius: 10px; cursor: pointer; transition: all 0.15s; font-size: 15px; display: flex; align-items: center; gap: 10px; }
  .options li:hover { border-color: #3498db; background: #f8fbff; }
  .options li.selected { border-color: #3498db; background: #eaf2f8; }
  .options li.correct { border-color: #27ae60; background: #eafaf1; }
  .options li.wrong { border-color: #e74c3c; background: #fdedec; }
  .options li.disabled { pointer-events: none; opacity: 0.9; }
  .options li .opt-label { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: #ecf0f1; font-weight: bold; font-size: 13px; flex-shrink: 0; }
  .options li.selected .opt-label { background: #3498db; color: #fff; }
  .options li.correct .opt-label { background: #27ae60; color: #fff; }
  .options li.wrong .opt-label { background: #e74c3c; color: #fff; }
  .fill-input { width: 100%; padding: 12px 14px; border: 2px solid #ecf0f1; border-radius: 10px; font-size: 15px; font-family: inherit; margin-bottom: 10px; transition: border-color 0.15s; }
  .fill-input:focus { outline: none; border-color: #3498db; }
  .fill-input.correct { border-color: #27ae60; background: #eafaf1; }
  .fill-input.wrong { border-color: #e74c3c; background: #fdedec; }
  .fill-input:disabled { background: #f8f9fa; }
  .text-area { width: 100%; min-height: 140px; padding: 12px 14px; border: 2px solid #ecf0f1; border-radius: 10px; font-size: 15px; font-family: inherit; resize: vertical; transition: border-color 0.15s; }
  .text-area:focus { outline: none; border-color: #3498db; }
  .feedback { margin-top: 16px; padding: 14px 18px; border-radius: 10px; font-size: 14px; line-height: 1.7; display: none; }
  .feedback.show { display: block; }
  .feedback.correct { background: #eafaf1; border-left: 4px solid #27ae60; color: #1e6b3a; }
  .feedback.wrong { background: #fdedec; border-left: 4px solid #e74c3c; color: #922b21; }
  .feedback.info { background: #eaf2f8; border-left: 4px solid #3498db; color: #1a5276; }
  .feedback .answer-line { font-weight: bold; margin-bottom: 6px; }
  .feedback .explain { color: #555; }
  .feedback .ref-answer { background: #fff; padding: 10px 14px; border-radius: 8px; margin-top: 8px; border: 1px solid #d5dbdb; white-space: pre-wrap; }
  .action-row { margin-top: 16px; text-align: right; }
  .self-eval { margin-top: 12px; text-align: center; }
  .self-eval button { margin: 0 6px; }
  .score-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; text-align: center; }
  .score-board .item { background: #f8fafc; border-radius: 10px; padding: 14px 8px; border: 1px solid #ecf0f1; }
  .score-board .item .num { font-size: 26px; font-weight: bold; color: #2980b9; }
  .score-board .item .lbl { font-size: 12px; color: #7f8c8d; margin-top: 4px; }
  .score-board .item.good .num { color: #27ae60; }
  .score-board .item.bad .num { color: #e74c3c; }
  .review-item { padding: 12px 16px; margin-bottom: 10px; border-radius: 10px; background: #fdedec; border-left: 4px solid #e74c3c; font-size: 14px; line-height: 1.6; }
  .review-item .rq { font-weight: bold; color: #922b21; margin-bottom: 6px; }
  .review-item .ra { color: #27ae60; }
  .review-item .rx { color: #7f8c8d; font-size: 13px; margin-top: 4px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<h1>智能统计分析与决策 · 抽题练习系统</h1>
<div class="subtitle">7 种题型 · 章节筛选 · 随机抽题 · 自动判分 · 答案解析</div>

<div class="panel" id="setupPanel">
  <h3>练习设置</h3>
  <div class="setup-row">
    <label>选择章节：</label>
    <select id="chapterSelect">
      <option value="all">全部章节</option>
      <option value="ch1">第1章 统计与数据基础</option>
      <option value="ch2">第2章 描述性统计</option>
      <option value="ch3">第3章 概率与分布</option>
      <option value="ch4">第4章 抽样分布与中心极限定理</option>
      <option value="ch5">第5章 参数估计</option>
      <option value="ch6">第6章 假设检验</option>
      <option value="ch7">第7章 方差分析</option>
      <option value="ch8">第8章 回归分析</option>
      <option value="ch9">第9章 机器学习与智能决策</option>
    </select>
  </div>
  <div class="setup-row">
    <label>题型筛选：</label>
    <select id="typeSelect">
      <option value="all">全部题型</option>
      <option value="单选题">单选题</option>
      <option value="多选题">多选题</option>
      <option value="判断题">判断题</option>
      <option value="填空题">填空题</option>
      <option value="简答题">简答题</option>
      <option value="计算题">计算题</option>
      <option value="应用题">应用题</option>
    </select>
  </div>
  <div class="setup-row">
    <label>抽题数量：</label>
    <input type="number" id="numQuestions" value="10" min="1" max="50">
    <label style="font-size:13px; color:#95a5a6;">（题库共 <span id="totalCount">0</span> 题）</label>
  </div>
  <div class="setup-row">
    <label>答题模式：</label>
    <select id="modeSelect">
      <option value="practice">练习模式（每题立即看答案）</option>
      <option value="exam">考试模式（全部答完统一看结果）</option>
    </select>
  </div>
  <div style="margin-top:14px;">
    <button class="btn green" id="startBtn">开始练习</button>
  </div>
</div>

<div class="panel hidden" id="quizPanel">
  <div class="q-meta">
    <span>
      <span class="chapter-tag" id="qChapter">-</span>
      <span class="type-tag" id="qType">-</span>
    </span>
    <span>第 <b id="qIndex">1</b> / <b id="qTotal">10</b> 题</span>
  </div>
  <div class="progress-bar"><div class="fill" id="progressFill"></div></div>

  <div class="q-text" id="qText">-</div>

  <div id="answerArea"></div>

  <div class="feedback" id="feedback"></div>

  <div class="action-row">
    <button class="btn gray" id="quitBtn">退出练习</button>
    <button class="btn" id="submitBtn">提交答案</button>
    <button class="btn green hidden" id="nextBtn">下一题</button>
  </div>
</div>

<div class="panel hidden" id="resultPanel">
  <h3>练习结果</h3>
  <div class="score-board">
    <div class="item"><div class="num" id="resTotal">0</div><div class="lbl">总题数</div></div>
    <div class="item good"><div class="num" id="resCorrect">0</div><div class="lbl">答对</div></div>
    <div class="item bad"><div class="num" id="resWrong">0</div><div class="lbl">答错</div></div>
    <div class="item"><div class="num" id="resRate">0%</div><div class="lbl">正确率</div></div>
  </div>
  <div style="margin-top:18px;">
    <h3 style="font-size:14px;">错题回顾</h3>
    <div id="reviewList"></div>
  </div>
  <div style="margin-top:16px; text-align:center;">
    <button class="btn green" id="restartBtn">再练一次</button>
    <button class="btn orange" id="backBtn">返回设置</button>
  </div>
</div>

<script>
// ==================== 题库 ====================
// 题型：单选题 | 多选题 | 判断题 | 填空题 | 简答题 | 计算题 | 应用题
//
// 结构说明：
// 单选题/判断题：{ chapter, type, q, options:[...], answer: 索引, explain }
// 多选题：      { chapter, type, q, options:[...], answer:[索引数组], explain }
// 填空题：      { chapter, type, q, blanks:[正确答案数组], explain }
//               题干中用 ___ 表示空位（按顺序对应）
// 简答/计算/应用：{ chapter, type, q, refAnswer: "参考答案", explain }
//               这类题由学生自评对错

var QUESTION_BANK = [
  // ==================== 第1章 统计与数据基础（70题） ====================

// ===== 填空题 20 题 =====
{ chapter: "ch1", type: "填空题", q: "研究对象的全体称为______，从总体中抽取的一部分个体称为______。", blanks: ["总体", "样本"], explain: "总体是研究对象的全体，样本是从总体中抽取的部分个体。" },
{ chapter: "ch1", type: "填空题", q: "对总体中每一个个体都进行调查的方式称为______。", blanks: ["普查"], explain: "普查是对总体全部个体进行调查。" },
{ chapter: "ch1", type: "填空题", q: "从总体中抽取样本，并对样本进行观察和分析，以此推断总体特征的方法称为______。", blanks: ["抽样调查"], explain: "抽样调查通过样本推断总体。" },
{ chapter: "ch1", type: "填空题", q: "描述总体特征的数值称为______，描述样本特征的数值称为______。", blanks: ["参数", "统计量"], explain: "参数描述总体，统计量描述样本。" },
{ chapter: "ch1", type: "填空题", q: "只能归入某一类别、不能进行数值运算的数据称为______数据。", blanks: ["定性", "分类"], explain: "定性数据（分类数据）不能进行数值运算。" },
{ chapter: "ch1", type: "填空题", q: "可以用数值表示、能进行数学运算的数据称为______数据。", blanks: ["定量", "数值"], explain: "定量数据（数值数据）可以进行数学运算。" },
{ chapter: "ch1", type: "填空题", q: "测量尺度中，最低级别的是______尺度。", blanks: ["定类"], explain: "定类尺度是最低级别的测量尺度，仅能分类。" },
{ chapter: "ch1", type: "填空题", q: "测量尺度中，最高级别的是______尺度。", blanks: ["定比"], explain: "定比尺度有绝对零点，是最高级别的测量尺度。" },
{ chapter: "ch1", type: "填空题", q: "既有相等单位又有绝对零点的测量尺度称为______尺度。", blanks: ["定比"], explain: "定比尺度具有相等单位和绝对零点。" },
{ chapter: "ch1", type: "填空题", q: "有相等单位但没有绝对零点的测量尺度称为______尺度。", blanks: ["定距"], explain: "定距尺度有相等单位但无绝对零点。" },
{ chapter: "ch1", type: "填空题", q: "只能排序、不能测量差距的测量尺度称为______尺度。", blanks: ["定序"], explain: "定序尺度可以排序，但不能测量差距。" },
{ chapter: "ch1", type: "填空题", q: "某高校全体学生构成______，从中抽取的500名学生构成______。", blanks: ["总体", "样本"], explain: "全体学生是总体，抽取的500名是样本。" },
{ chapter: "ch1", type: "填空题", q: "统计工作的四个基本环节是：______、______、______、______。", blanks: ["统计设计", "统计调查", "统计整理", "统计分析"], explain: "统计工作包括设计、调查、整理、分析四个环节。" },
{ chapter: "ch1", type: "填空题", q: "按照一定标志将总体单位划分为若干组的方法称为______。", blanks: ["统计分组"], explain: "统计分组是按标志将总体单位分组。" },
{ chapter: "ch1", type: "填空题", q: "反映总体单位属性和特征的名称称为______。", blanks: ["标志"], explain: "标志是反映总体单位属性和特征的名称。" },
{ chapter: "ch1", type: "填空题", q: "标志按是否可用数值表示，分为______标志和______标志。", blanks: ["品质", "数量"], explain: "标志分为品质标志和数量标志。" },
{ chapter: "ch1", type: "填空题", q: "统计指标是反映总体______特征的概念和数值。", blanks: ["数量"], explain: "统计指标反映总体的数量特征。" },
{ chapter: "ch1", type: "填空题", q: "变量按取值是否连续，分为______变量和______变量。", blanks: ["连续", "离散"], explain: "变量分为连续变量和离散变量。" },
{ chapter: "ch1", type: "填空题", q: "某班级学生的身高属于______变量。", blanks: ["连续"], explain: "身高可以取任意数值，属于连续变量。" },
{ chapter: "ch1", type: "填空题", q: "某班级的学生人数属于______变量。", blanks: ["离散"], explain: "人数只能取整数，属于离散变量。" },

// ===== 单选题 20 题 =====
{ chapter: "ch1", type: "单选题", q: "下列哪一项属于定量数据？", options: ["性别", "血型", "身高", "职业"], answer: 2, explain: "身高可以测量并计算，属于定量数据。" },
{ chapter: "ch1", type: "单选题", q: "某班级学生的考试成绩属于哪种测量尺度？", options: ["定类尺度", "定序尺度", "定距尺度", "定比尺度"], answer: 2, explain: "考试成绩有相等单位但无绝对零点，属于定距尺度。" },
{ chapter: "ch1", type: "单选题", q: "下列哪项是总体？", options: ["从某高校抽取的500名学生", "某高校全体学生", "某高校学生的平均身高", "500名学生的平均身高"], answer: 1, explain: "总体是研究对象的全体。" },
{ chapter: "ch1", type: "单选题", q: "下列哪项是样本？", options: ["某高校全体学生", "某高校学生的平均身高", "从某高校抽取的500名学生", "某高校学生总数"], answer: 2, explain: "样本是从总体中抽取的部分个体。" },
{ chapter: "ch1", type: "单选题", q: "下列哪项属于品质标志？", options: ["年龄", "身高", "性别", "体重"], answer: 2, explain: "性别是品质标志，不能用数值表示。" },
{ chapter: "ch1", type: "单选题", q: "下列哪项属于数量标志？", options: ["性别", "年龄", "民族", "职业"], answer: 1, explain: "年龄是数量标志，可以用数值表示。" },
{ chapter: "ch1", type: "单选题", q: "下列哪项属于离散变量？", options: ["身高", "体重", "学生人数", "温度"], answer: 2, explain: "学生人数只能取整数，属于离散变量。" },
{ chapter: "ch1", type: "单选题", q: "下列哪项属于连续变量？", options: ["学生人数", "家庭子女数", "身高", "车辆数"], answer: 2, explain: "身高可以取任意数值，属于连续变量。" },
{ chapter: "ch1", type: "单选题", q: "普查与抽样调查相比，其主要缺点是：", options: ["准确性差", "成本高、时间长", "无法推断总体", "样本量小"], answer: 1, explain: "普查需要调查全部个体，成本高、时间长。" },
{ chapter: "ch1", type: "单选题", q: "抽样调查的主要优点是：", options: ["不需要推断总体", "成本低、速度快", "可以完全避免误差", "不需要设计方案"], answer: 1, explain: "抽样调查成本低、速度快，但需要科学设计。" },
{ chapter: "ch1", type: "单选题", q: "统计工作的第一步是：", options: ["统计调查", "统计设计", "统计整理", "统计分析"], answer: 1, explain: "统计工作的第一步是统计设计。" },
{ chapter: "ch1", type: "单选题", q: "统计工作的最后一步是：", options: ["统计调查", "统计设计", "统计整理", "统计分析"], answer: 3, explain: "统计工作的最后一步是统计分析。" },
{ chapter: "ch1", type: "单选题", q: "反映总体数量特征的概念和数值称为：", options: ["标志", "变量", "统计指标", "统计分组"], answer: 2, explain: "统计指标反映总体的数量特征。" },
{ chapter: "ch1", type: "单选题", q: "反映总体单位属性和特征的名称称为：", options: ["标志", "指标", "变量", "分组"], answer: 0, explain: "标志是反映总体单位属性和特征的名称。" },
{ chapter: "ch1", type: "单选题", q: "下列哪项属于定类尺度？", options: ["身高", "考试成绩", "性别", "收入"], answer: 2, explain: "性别只能分类，不能排序，属于定类尺度。" },
{ chapter: "ch1", type: "单选题", q: "下列哪项属于定序尺度？", options: ["性别", "满意度等级", "身高", "收入"], answer: 1, explain: "满意度等级可以排序但不能测量差距，属于定序尺度。" },
{ chapter: "ch1", type: "单选题", q: "下列哪项属于定距尺度？", options: ["性别", "满意度等级", "温度（摄氏）", "收入"], answer: 2, explain: "摄氏温度有相等单位但无绝对零点，属于定距尺度。" },
{ chapter: "ch1", type: "单选题", q: "下列哪项属于定比尺度？", options: ["性别", "满意度等级", "摄氏温度", "收入"], answer: 3, explain: "收入有绝对零点，属于定比尺度。" },
{ chapter: "ch1", type: "单选题", q: "统计分组的关键是：", options: ["确定组数", "选择分组标志", "计算组距", "绘制图表"], answer: 1, explain: "统计分组的关键是选择合适的分组标志。" },
{ chapter: "ch1", type: "单选题", q: "下列哪项不属于统计工作的基本环节？", options: ["统计设计", "统计调查", "统计整理", "统计预测"], answer: 3, explain: "统计预测不属于统计工作的四个基本环节。" },

// ===== 简答题 10 题 =====
{ chapter: "ch1", type: "简答题", q: "简述总体与样本的区别与联系。", refAnswer: "区别：总体是研究对象的全体，样本是从总体中抽取的一部分个体。联系：样本是总体的代表，通过对样本的分析可以推断总体的特征。", explain: "总体与样本是统计推断的两个基本概念。" },
{ chapter: "ch1", type: "简答题", q: "简述参数与统计量的区别。", refAnswer: "参数是描述总体特征的数值，通常是未知的；统计量是描述样本特征的数值，是可以计算的。统计量用于推断参数。", explain: "参数描述总体，统计量描述样本。" },
{ chapter: "ch1", type: "简答题", q: "简述定性数据与定量数据的区别。", refAnswer: "定性数据（分类数据）只能用类别表示，不能进行数值运算；定量数据（数值数据）可以用数值表示，能进行数学运算。", explain: "定性数据用于分类，定量数据用于计算。" },
{ chapter: "ch1", type: "简答题", q: "简述四种测量尺度的区别。", refAnswer: "定类尺度：只能分类；定序尺度：可以排序但不能测量差距；定距尺度：有相等单位但无绝对零点；定比尺度：有相等单位和绝对零点。", explain: "四种测量尺度从低到高依次为定类、定序、定距、定比。" },
{ chapter: "ch1", type: "简答题", q: "简述普查与抽样调查的优缺点。", refAnswer: "普查：能获得全面信息，但成本高、时间长；抽样调查：成本低、速度快，但存在抽样误差，需要科学设计。", explain: "两种调查方式各有优缺点，应根据研究目的选择。" },
{ chapter: "ch1", type: "简答题", q: "简述统计工作的四个基本环节。", refAnswer: "统计设计、统计调查、统计整理、统计分析。", explain: "统计工作的四个基本环节依次进行。" },
{ chapter: "ch1", type: "简答题", q: "简述品质标志与数量标志的区别。", refAnswer: "品质标志反映总体单位的属性特征，不能用数值表示；数量标志反映总体单位的数量特征，可以用数值表示。", explain: "品质标志用于分类，数量标志用于计算。" },
{ chapter: "ch1", type: "简答题", q: "简述连续变量与离散变量的区别。", refAnswer: "连续变量可以取某一区间内的任意数值；离散变量只能取有限或可数的数值。", explain: "连续变量取值连续，离散变量取值可数。" },
{ chapter: "ch1", type: "简答题", q: "简述统计指标与标志的区别。", refAnswer: "统计指标反映总体的数量特征；标志反映总体单位的属性和特征。", explain: "指标描述总体，标志描述总体单位。" },
{ chapter: "ch1", type: "简答题", q: "简述统计分组的作用。", refAnswer: "统计分组可以揭示总体内部的结构和分布特征，便于分析不同组之间的差异和联系，是统计整理的重要方法。", explain: "统计分组用于揭示总体内部结构。" },

// ===== 简答题 10 题 =====
{ chapter: "ch3", type: "简答题", q: "简述互斥事件与独立事件的区别。", refAnswer: "互斥事件指不能同时发生，P(A∩B)=0；独立事件指一个事件发生不影响另一个事件发生的概率，P(A∩B)=P(A)P(B)。互斥不一定独立，独立不一定互斥。", explain: "两个概念常被混淆，需从定义和公式区分。" },
{ chapter: "ch3", type: "简答题", q: "简述离散型随机变量与连续型随机变量的区别。", refAnswer: "离散型随机变量取值有限或可数，用分布列描述；连续型随机变量取值连续，用概率密度函数描述。连续型单点概率为0，区间概率通过积分计算。", explain: "两类随机变量的描述方式和概率计算不同。" },
{ chapter: "ch3", type: "简答题", q: "简述二项分布的条件。", refAnswer: "1. n次独立重复试验；2. 每次试验只有两种结果（成功/失败）；3. 每次试验成功概率p相同。", explain: "二项分布的三个基本条件。" },
{ chapter: "ch3", type: "简答题", q: "简述正态分布的特点。", refAnswer: "1. 钟形曲线，关于均值μ对称；2. 均值为μ，方差为σ²；3. 两端趋近于0但永不为0；4. 在均值处取得最大值；5. 由μ和σ²完全确定。", explain: "正态分布的核心特征。" },
{ chapter: "ch3", type: "简答题", q: "简述标准正态分布及其应用。", refAnswer: "标准正态分布N(0,1)，均值为0，标准差为1。任何正态分布X~N(μ,σ²)通过Z=(X-μ)/σ可转化为标准正态，便于查表计算概率。", explain: "标准化是正态分布计算的关键步骤。" },
{ chapter: "ch3", type: "简答题", q: "简述期望和方差的意义。", refAnswer: "期望反映随机变量的平均取值水平；方差反映随机变量取值的离散程度。期望和方差是随机变量最重要的两个数字特征。", explain: "期望衡量集中趋势，方差衡量离散程度。" },
{ chapter: "ch3", type: "简答题", q: "简述大数定律与中心极限定理的区别。", refAnswer: "大数定律说明样本均值依概率收敛于总体均值，描述的是收敛性；中心极限定理说明样本均值的分布近似正态，描述的是分布形态。两者都是概率论的重要极限定理。", explain: "大数定律讲收敛，中心极限定理讲分布。" },
{ chapter: "ch3", type: "简答题", q: "简述泊松分布的应用场景。", refAnswer: "泊松分布常用于描述单位时间或空间内稀有事件发生的次数，如电话呼叫数、交通事故数、放射性衰变数等。均值和方差都等于λ。", explain: "泊松分布适用于稀有事件计数。" },
{ chapter: "ch3", type: "简答题", q: "简述条件概率与全概率公式的关系。", refAnswer: "条件概率P(A|B)=P(AB)/P(B)描述在B发生条件下A发生的概率；全概率公式P(B)=ΣP(B|Aᵢ)P(Aᵢ)将复杂事件B分解为若干互斥情况，利用条件概率计算B的总概率。", explain: "全概率公式是条件概率的应用。" },
{ chapter: "ch3", type: "简答题", q: "简述贝叶斯公式的意义。", refAnswer: "贝叶斯公式P(A|B)=P(B|A)P(A)/P(B)用于由结果反推原因，将先验概率与似然结合得到后验概率，是贝叶斯统计的基础。", explain: "贝叶斯公式实现由果推因。" },

// ===== 计算题 40 题 =====
{ chapter: "ch3", type: "计算题", q: "掷一枚均匀骰子，求出现点数大于4的概率。", refAnswer: "样本空间{1,2,3,4,5,6}，大于4的有{5,6}共2个。P=2/6=1/3≈0.333。", explain: "古典概型，有利点数除以总点数。" },
{ chapter: "ch3", type: "计算题", q: "从一副52张扑克牌中随机抽一张，求抽到红桃或黑桃的概率。", refAnswer: "红桃13张，黑桃13张，共26张。P=26/52=0.5。", explain: "红桃和黑桃互斥，概率相加。" },
{ chapter: "ch3", type: "计算题", q: "已知P(A)=0.4，P(B)=0.5，P(A∩B)=0.2，求P(A∪B)。", refAnswer: "P(A∪B)=P(A)+P(B)-P(A∩B)=0.4+0.5-0.2=0.7。", explain: "加法法则。" },
{ chapter: "ch3", type: "计算题", q: "已知P(A)=0.4，P(B)=0.5，A、B独立，求P(A∩B)和P(A∪B)。", refAnswer: "P(A∩B)=0.4×0.5=0.2；P(A∪B)=0.4+0.5-0.2=0.7。", explain: "独立事件交概率等于乘积。" },
{ chapter: "ch3", type: "计算题", q: "已知P(A)=0.6，P(B|A)=0.5，求P(A∩B)。", refAnswer: "P(A∩B)=P(B|A)P(A)=0.5×0.6=0.3。", explain: "条件概率公式变形。" },
{ chapter: "ch3", type: "计算题", q: "某工厂两条生产线，甲线产量占60%，次品率2%；乙线产量占40%，次品率3%。求总次品率。", refAnswer: "P(次品)=0.6×0.02+0.4×0.03=0.012+0.012=0.024=2.4%。", explain: "全概率公式。" },
{ chapter: "ch3", type: "计算题", q: "上题中，若抽到一件次品，求它来自甲线的概率。", refAnswer: "P(甲|次品)=0.6×0.02/0.024=0.012/0.024=0.5。", explain: "贝叶斯公式。" },
{ chapter: "ch3", type: "计算题", q: "若X~B(10,0.3)，求E(X)和Var(X)。", refAnswer: "E(X)=np=10×0.3=3；Var(X)=np(1-p)=10×0.3×0.7=2.1。", explain: "二项分布的数字特征。" },
{ chapter: "ch3", type: "计算题", q: "若X~B(5,0.5)，求P(X=2)。", refAnswer: "P(X=2)=C(5,2)×0.5²×0.5³=10×0.25×0.125=0.3125。", explain: "二项分布概率公式。" },
{ chapter: "ch3", type: "计算题", q: "若X~P(3)，求E(X)和Var(X)。", refAnswer: "E(X)=λ=3；Var(X)=λ=3。", explain: "泊松分布均值和方差都等于λ。" },
{ chapter: "ch3", type: "计算题", q: "若X~P(2)，求P(X=0)。", refAnswer: "P(X=0)=2⁰e⁻²/0!=e⁻²≈0.1353。", explain: "泊松分布概率公式。" },
{ chapter: "ch3", type: "计算题", q: "若X~N(50,100)，求P(X<50)。", refAnswer: "正态分布关于均值对称，P(X<50)=0.5。", explain: "对称性。" },
{ chapter: "ch3", type: "计算题", q: "若X~N(0,1)，求P(-1<X<1)。", refAnswer: "P(-1<X<1)≈0.6827。", explain: "标准正态分布1σ范围。" },
{ chapter: "ch3", type: "计算题", q: "若X~N(0,1)，求P(-1.96<X<1.96)。", refAnswer: "P(-1.96<X<1.96)≈0.95。", explain: "标准正态分布95%范围。" },
{ chapter: "ch3", type: "计算题", q: "若X~N(0,1)，求P(X>1.645)。", refAnswer: "P(X>1.645)≈0.05。", explain: "单侧95%分位数。" },
{ chapter: "ch3", type: "计算题", q: "若X~N(0,1)，求P(X>2.33)。", refAnswer: "P(X>2.33)≈0.01。", explain: "单侧99%分位数。" },
{ chapter: "ch3", type: "计算题", q: "若X~N(100,25)，求P(X<100)。", refAnswer: "P(X<100)=0.5。", explain: "正态分布关于均值对称。" },
{ chapter: "ch3", type: "计算题", q: "若X~N(100,25)，求标准差。", refAnswer: "方差为25，标准差=√25=5。", explain: "标准差为方差平方根。" },
{ chapter: "ch3", type: "计算题", q: "若X~N(100,25)，求P(95<X<105)。", refAnswer: "标准化：Z=(X-100)/5，P(95<X<105)=P(-1<Z<1)≈0.6827。", explain: "标准化后查标准正态表。" },
{ chapter: "ch3", type: "计算题", q: "若X~U(0,10)，求E(X)和Var(X)。", refAnswer: "E(X)=5；Var(X)=(10-0)²/12=100/12≈8.33。", explain: "均匀分布的数字特征。" },
{ chapter: "ch3", type: "计算题", q: "若X~U(2,8)，求E(X)和Var(X)。", refAnswer: "E(X)=(2+8)/2=5；Var(X)=(8-2)²/12=36/12=3。", explain: "均匀分布公式。" },
{ chapter: "ch3", type: "计算题", q: "若X~Exp(2)，求E(X)和Var(X)。", refAnswer: "E(X)=1/λ=0.5；Var(X)=1/λ²=0.25。", explain: "指数分布的数字特征。" },
{ chapter: "ch3", type: "计算题", q: "已知E(X)=3，E(Y)=4，求E(2X+3Y)。", refAnswer: "E(2X+3Y)=2E(X)+3E(Y)=6+12=18。", explain: "期望的线性性质。" },
{ chapter: "ch3", type: "计算题", q: "已知Var(X)=4，求Var(3X+2)。", refAnswer: "Var(3X+2)=3²Var(X)=9×4=36。", explain: "方差中常数不影响，系数平方。" },
{ chapter: "ch3", type: "计算题", q: "已知Var(X)=4，Var(Y)=9，X、Y独立，求Var(X+Y)。", refAnswer: "Var(X+Y)=Var(X)+Var(Y)=4+9=13。", explain: "独立时方差可加。" },
{ chapter: "ch3", type: "计算题", q: "已知E(X)=2，E(Y)=3，E(XY)=8，求Cov(X,Y)。", refAnswer: "Cov(X,Y)=E(XY)-E(X)E(Y)=8-6=2。", explain: "协方差公式。" },
{ chapter: "ch3", type: "计算题", q: "已知Cov(X,Y)=2，Var(X)=4，Var(Y)=9，求相关系数ρ。", refAnswer: "ρ=Cov(X,Y)/√(Var(X)Var(Y))=2/√36=2/6=1/3≈0.333。", explain: "相关系数公式。" },
{ chapter: "ch3", type: "计算题", q: "若X~B(20,0.4)，求E(X)和Var(X)。", refAnswer: "E(X)=20×0.4=8；Var(X)=20×0.4×0.6=4.8。", explain: "二项分布数字特征。" },
{ chapter: "ch3", type: "计算题", q: "若X~P(5)，求P(X=1)。", refAnswer: "P(X=1)=5¹e⁻⁵/1!=5e⁻⁵≈0.0337。", explain: "泊松分布公式。" },
{ chapter: "ch3", type: "计算题", q: "某产品合格率0.9，随机抽3件，求恰有2件合格的概率。", refAnswer: "X~B(3,0.9)，P(X=2)=C(3,2)×0.9²×0.1=3×0.81×0.1=0.243。", explain: "二项分布应用。" },
{ chapter: "ch3", type: "计算题", q: "某电话交换台每分钟接到呼叫数服从P(3)，求一分钟内接到2次呼叫的概率。", refAnswer: "P(X=2)=3²e⁻³/2!=9e⁻³/2≈0.224。", explain: "泊松分布应用。" },
{ chapter: "ch3", type: "计算题", q: "某零件长度服从N(10,0.04)，求长度在9.8到10.2之间的概率。", refAnswer: "σ=0.2，Z=(9.8-10)/0.2=-1，Z=(10.2-10)/0.2=1，P≈0.6827。", explain: "正态分布标准化。" },
{ chapter: "ch3", type: "计算题", q: "某考试成绩服从N(70,100)，求成绩超过80的概率。", refAnswer: "σ=10，Z=(80-70)/10=1，P(X>80)=P(Z>1)≈0.1587。", explain: "正态分布标准化查表。" },
{ chapter: "ch3", type: "计算题", q: "某考试成绩服从N(70,100)，求成绩在60到80之间的概率。", refAnswer: "Z=(60-70)/10=-1，Z=(80-70)/10=1，P≈0.6827。", explain: "正态分布区间概率。" },
{ chapter: "ch3", type: "计算题", q: "已知P(A)=0.5，P(B)=0.6，P(A∪B)=0.8，求P(A∩B)。", refAnswer: "P(A∩B)=P(A)+P(B)-P(A∪B)=0.5+0.6-0.8=0.3。", explain: "加法法则变形。" },
{ chapter: "ch3", type: "计算题", q: "已知P(A)=0.5，P(B)=0.6，P(A∩B)=0.3，判断A、B是否独立。", refAnswer: "P(A)P(B)=0.5×0.6=0.3=P(A∩B)，所以A、B独立。", explain: "独立性判定。" },
{ chapter: "ch3", type: "计算题", q: "某产品次品率0.05，随机抽10件，求恰有1件次品的概率（用二项分布）。", refAnswer: "X~B(10,0.05)，P(X=1)=C(10,1)×0.05×0.95⁹≈10×0.05×0.6302≈0.3151。", explain: "二项分布应用。" },
{ chapter: "ch3", type: "计算题", q: "某设备平均无故障时间服从指数分布，均值500小时，求E(X)和Var(X)。", refAnswer: "1/λ=500，λ=0.002。E(X)=500；Var(X)=1/λ²=250000。", explain: "指数分布参数与数字特征。" },
{ chapter: "ch3", type: "计算题", q: "已知X~N(0,1)，求P(X<-1.96)。", refAnswer: "P(X<-1.96)=P(X>1.96)≈0.025。", explain: "标准正态分布对称性。" },
{ chapter: "ch3", type: "计算题", q: "已知X~N(0,1)，求P(X>1.28)。", refAnswer: "P(X>1.28)≈0.10。", explain: "单侧90%分位数。" },

// ===== 简答题 10 题 =====
{ chapter: "ch4", type: "简答题", q: "简述抽样分布的概念。", refAnswer: "抽样分布是指从总体中反复抽取容量为n的样本，由样本统计量（如样本均值、样本方差、样本比例）形成的概率分布。它描述了统计量的取值规律，是推断统计的基础。", explain: "抽样分布是统计量的分布。" },
{ chapter: "ch4", type: "简答题", q: "简述样本均值抽样分布的性质。", refAnswer: "1. 期望等于总体均值：E(x̄)=μ；2. 方差为σ²/n，标准误为σ/√n；3. 当总体正态或n足够大时，样本均值服从或近似服从正态分布。", explain: "样本均值抽样分布的三条核心性质。" },
{ chapter: "ch4", type: "简答题", q: "简述中心极限定理的内容和意义。", refAnswer: "内容：从均值为μ、方差为σ²的总体中抽取容量为n的样本，当n足够大时，样本均值近似服从正态分布N(μ,σ²/n)。意义：无论总体分布如何，样本均值都近似正态，为推断统计提供了理论基础。", explain: "中心极限定理是推断统计的基石。" },
{ chapter: "ch4", type: "简答题", q: "简述标准误与标准差的区别。", refAnswer: "标准差描述个体观测值的离散程度，反映数据的波动；标准误描述样本统计量（如样本均值）的抽样分布的标准差，反映估计的精度。标准误=标准差/√n，样本量越大，标准误越小。", explain: "标准差描述个体差异，标准误描述估计精度。" },
{ chapter: "ch4", type: "简答题", q: "简述χ²分布的定义和性质。", refAnswer: "定义：k个独立标准正态变量的平方和服从χ²(k)分布。性质：1. 均值为k，方差为2k；2. 取值范围非负；3. k增大时趋近正态分布；4. 常用于方差推断、拟合优度检验和独立性检验。", explain: "卡方分布的定义和四条性质。" },
{ chapter: "ch4", type: "简答题", q: "简述T分布的定义和性质。", refAnswer: "定义：T=Z/√(χ²(df)/df)，其中Z为标准正态，χ²(df)为独立卡方。性质：1. 关于0对称；2. 均值为0；3. df增大时趋近标准正态；4. 尾部比标准正态厚，常用于小样本均值推断。", explain: "T分布的定义和四条性质。" },
{ chapter: "ch4", type: "简答题", q: "简述F分布的定义和性质。", refAnswer: "定义：F=(χ²(d1)/d1)/(χ²(d2)/d2)，两个独立卡方分布之比除以各自自由度。性质：1. 取值范围非负；2. 有分子自由度d1和分母自由度d2；3. 倒数仍为F分布（自由度互换）；4. 常用于方差齐性检验和方差分析。", explain: "F分布的定义和四条性质。" },
{ chapter: "ch4", type: "简答题", q: "简述χ²分布、T分布、F分布之间的关系。", refAnswer: "1. T²=F(1,df)，即T分布的平方服从分子自由度为1的F分布；2. F(1,d)的平方根等于|T(d)|；3. 三者都可由独立标准正态变量构造；4. χ²是正态平方和，T是正态除以卡方平方根，F是两个卡方之比。", explain: "三个分布之间的数学关系。" },
{ chapter: "ch4", type: "简答题", q: "简述样本均值无偏性的含义。", refAnswer: "无偏性指估计量的期望等于被估参数。样本均值的期望E(x̄)=μ，说明样本均值是总体均值的无偏估计。无偏性不代表每次估计都等于参数，而是说在反复抽样中，估计量的平均值等于参数。", explain: "无偏性是估计量的重要性质。" },
{ chapter: "ch4", type: "简答题", q: "简述中心极限定理在智能决策中的应用。", refAnswer: "中心极限定理使我们在总体分布未知时，仍能利用样本均值近似正态的性质构造置信区间、进行假设检验，从而支持数据驱动的决策。例如在电商用户行为分析、金融风控、医疗决策中，都可以基于样本均值推断总体特征。", explain: "中心极限定理是智能决策中统计推断的基础。" },

{ chapter: "ch4", type: "计算题", q: "总体均值μ=50，标准差σ=10，样本量n=25，求样本均值的期望和标准误。", refAnswer: "E(x̄)=μ=50；标准误=σ/√n=10/√25=10/5=2。", explain: "样本均值期望等于总体均值，标准误为σ/√n。" },
{ chapter: "ch4", type: "计算题", q: "总体均值μ=100，标准差σ=20，样本量n=100，求样本均值的标准误。", refAnswer: "标准误=σ/√n=20/√100=20/10=2。", explain: "标准误公式。" },
{ chapter: "ch4", type: "计算题", q: "总体标准差σ=15，样本量n=36，求样本均值的标准误。", refAnswer: "标准误=σ/√n=15/√36=15/6=2.5。", explain: "标准误公式。" },
{ chapter: "ch4", type: "计算题", q: "总体标准差σ=12，样本量n=16，求样本均值的标准误。", refAnswer: "标准误=σ/√n=12/√16=12/4=3。", explain: "标准误公式。" },
{ chapter: "ch4", type: "计算题", q: "样本量从25增加到100，标准误变为原来的多少倍？", refAnswer: "标准误与√n成反比。√25=5，√100=10，所以标准误变为原来的5/10=1/2。", explain: "标准误与√n成反比。" },
{ chapter: "ch4", type: "计算题", q: "样本量从16增加到64，标准误变为原来的多少倍？", refAnswer: "√16=4，√64=8，标准误变为原来的4/8=1/2。", explain: "标准误与√n成反比。" },
{ chapter: "ch4", type: "计算题", q: "若X~χ²(8)，求E(X)和Var(X)。", refAnswer: "E(X)=k=8；Var(X)=2k=16。", explain: "卡方分布的数字特征。" },
{ chapter: "ch4", type: "计算题", q: "若X~χ²(15)，求E(X)和Var(X)。", refAnswer: "E(X)=15；Var(X)=30。", explain: "卡方分布的数字特征。" },
{ chapter: "ch4", type: "计算题", q: "若X~χ²(20)，求E(X)和Var(X)。", refAnswer: "E(X)=20；Var(X)=40。", explain: "卡方分布的数字特征。" },
{ chapter: "ch4", type: "计算题", q: "若X~χ²(5)，求E(X)和Var(X)。", refAnswer: "E(X)=5；Var(X)=10。", explain: "卡方分布的数字特征。" },
{ chapter: "ch4", type: "计算题", q: "若T~t(10)，求E(T)。", refAnswer: "E(T)=0。", explain: "T分布均值为0。" },
{ chapter: "ch4", type: "计算题", q: "若T~t(20)，求E(T)。", refAnswer: "E(T)=0。", explain: "T分布均值为0。" },
{ chapter: "ch4", type: "计算题", q: "若F~F(5,10)，求1/F的分布。", refAnswer: "1/F~F(10,5)。", explain: "F分布倒数自由度互换。" },
{ chapter: "ch4", type: "计算题", q: "若F~F(3,8)，求1/F的分布。", refAnswer: "1/F~F(8,3)。", explain: "F分布倒数自由度互换。" },
{ chapter: "ch4", type: "计算题", q: "已知总体比例p=0.4，样本量n=100，求样本比例的标准误。", refAnswer: "标准误=√(p(1-p)/n)=√(0.4×0.6/100)=√(0.24/100)=√0.0024≈0.049。", explain: "样本比例标准误公式。" },
{ chapter: "ch4", type: "计算题", q: "已知总体比例p=0.5，样本量n=400，求样本比例的标准误。", refAnswer: "标准误=√(0.5×0.5/400)=√(0.25/400)=√0.000625=0.025。", explain: "样本比例标准误公式。" },
{ chapter: "ch4", type: "计算题", q: "已知总体比例p=0.3，样本量n=900，求样本比例的标准误。", refAnswer: "标准误=√(0.3×0.7/900)=√(0.21/900)=√0.000233≈0.0153。", explain: "样本比例标准误公式。" },
{ chapter: "ch4", type: "计算题", q: "总体均值μ=60，标准差σ=18，样本量n=81，求样本均值的标准误。", refAnswer: "标准误=σ/√n=18/√81=18/9=2。", explain: "标准误公式。" },
{ chapter: "ch4", type: "计算题", q: "总体均值μ=200，标准差σ=40，样本量n=64，求样本均值的标准误。", refAnswer: "标准误=σ/√n=40/√64=40/8=5。", explain: "标准误公式。" },
{ chapter: "ch4", type: "计算题", q: "总体均值μ=80，标准差σ=24，样本量n=144，求样本均值的标准误。", refAnswer: "标准误=σ/√n=24/√144=24/12=2。", explain: "标准误公式。" },
{ chapter: "ch4", type: "计算题", q: "某总体均值μ=50，标准差σ=10，样本量n=25。求样本均值落在48到52之间的概率。", refAnswer: "标准误=10/5=2。Z=(48-50)/2=-1，Z=(52-50)/2=1。P(-1<Z<1)≈0.6827。", explain: "标准化后查标准正态表。" },
{ chapter: "ch4", type: "计算题", q: "某总体均值μ=100，标准差σ=20，样本量n=100。求样本均值大于104的概率。", refAnswer: "标准误=20/10=2。Z=(104-100)/2=2。P(Z>2)≈0.0228。", explain: "标准化后查表。" },
{ chapter: "ch4", type: "计算题", q: "某总体均值μ=100，标准差σ=20，样本量n=100。求样本均值小于96的概率。", refAnswer: "标准误=2。Z=(96-100)/2=-2。P(Z<-2)≈0.0228。", explain: "标准化后查表。" },
{ chapter: "ch4", type: "计算题", q: "某总体均值μ=50，标准差σ=15，样本量n=36。求样本均值在47到53之间的概率。", refAnswer: "标准误=15/6=2.5。Z=(47-50)/2.5=-1.2，Z=(53-50)/2.5=1.2。P(-1.2<Z<1.2)≈0.7698。", explain: "标准化后查表。" },
{ chapter: "ch4", type: "计算题", q: "某总体均值μ=60，标准差σ=12，样本量n=64。求样本均值大于63的概率。", refAnswer: "标准误=12/8=1.5。Z=(63-60)/1.5=2。P(Z>2)≈0.0228。", explain: "标准化后查表。" },
{ chapter: "ch4", type: "计算题", q: "某总体均值μ=60，标准差σ=12，样本量n=64。求样本均值小于57的概率。", refAnswer: "标准误=1.5。Z=(57-60)/1.5=-2。P(Z<-2)≈0.0228。", explain: "标准化后查表。" },
{ chapter: "ch4", type: "计算题", q: "某总体比例p=0.5，样本量n=100。求样本比例大于0.6的概率。", refAnswer: "标准误=√(0.5×0.5/100)=0.05。Z=(0.6-0.5)/0.05=2。P(Z>2)≈0.0228。", explain: "样本比例近似正态。" },
{ chapter: "ch4", type: "计算题", q: "某总体比例p=0.4，样本量n=400。求样本比例大于0.45的概率。", refAnswer: "标准误=√(0.4×0.6/400)=√0.0006≈0.0245。Z=(0.45-0.4)/0.0245≈2.04。P(Z>2.04)≈0.0207。", explain: "样本比例近似正态。" },
{ chapter: "ch4", type: "计算题", q: "某总体比例p=0.3，样本量n=900。求样本比例小于0.27的概率。", refAnswer: "标准误=√(0.3×0.7/900)≈0.0153。Z=(0.27-0.3)/0.0153≈-1.96。P(Z<-1.96)≈0.025。", explain: "样本比例近似正态。" },
{ chapter: "ch4", type: "计算题", q: "若X~χ²(4)，求P(X>9.49)（已知χ²₀.₀₅(4)=9.49）。", refAnswer: "P(X>9.49)=0.05。", explain: "卡方分布上侧分位数。" },
{ chapter: "ch4", type: "计算题", q: "若X~χ²(10)，求P(X>18.31)（已知χ²₀.₀₅(10)=18.31）。", refAnswer: "P(X>18.31)=0.05。", explain: "卡方分布上侧分位数。" },
{ chapter: "ch4", type: "计算题", q: "若T~t(10)，求P(T>1.812)（已知t₀.₀₅(10)=1.812）。", refAnswer: "P(T>1.812)=0.05。", explain: "T分布上侧分位数。" },
{ chapter: "ch4", type: "计算题", q: "若T~t(20)，求P(T>1.725)（已知t₀.₀₅(20)=1.725）。", refAnswer: "P(T>1.725)=0.05。", explain: "T分布上侧分位数。" },
{ chapter: "ch4", type: "计算题", q: "若F~F(5,10)，求P(F>3.33)（已知F₀.₀₅(5,10)=3.33）。", refAnswer: "P(F>3.33)=0.05。", explain: "F分布上侧分位数。" },
{ chapter: "ch4", type: "计算题", q: "若F~F(3,8)，求P(F>4.07)（已知F₀.₀₅(3,8)=4.07）。", refAnswer: "P(F>4.07)=0.05。", explain: "F分布上侧分位数。" },
{ chapter: "ch4", type: "计算题", q: "总体均值μ=50，标准差σ=10，样本量n=100。求样本均值在49到51之间的概率。", refAnswer: "标准误=10/10=1。Z=(49-50)/1=-1，Z=(51-50)/1=1。P(-1<Z<1)≈0.6827。", explain: "标准化后查表。" },
{ chapter: "ch4", type: "计算题", q: "总体均值μ=50，标准差σ=10，样本量n=100。求样本均值在48.04到51.96之间的概率。", refAnswer: "标准误=1。Z=(48.04-50)/1=-1.96，Z=(51.96-50)/1=1.96。P(-1.96<Z<1.96)=0.95。", explain: "标准化后查表。" },
{ chapter: "ch4", type: "计算题", q: "某总体均值μ=200，标准差σ=30，样本量n=100。求样本均值在194到206之间的概率。", refAnswer: "标准误=30/10=3。Z=(194-200)/3=-2，Z=(206-200)/3=2。P(-2<Z<2)≈0.9545。", explain: "标准化后查表。" },
{ chapter: "ch4", type: "计算题", q: "某总体均值μ=200，标准差σ=30，样本量n=100。求样本均值在192.26到207.74之间的概率。", refAnswer: "标准误=3。Z=(192.26-200)/3=-2.58，Z=(207.74-200)/3=2.58。P(-2.58<Z<2.58)≈0.99。", explain: "标准化后查表。" },
{ chapter: "ch4", type: "计算题", q: "已知总体标准差σ=20，样本量n=64，样本均值x̄=105。求总体均值μ的95%置信区间。", refAnswer: "标准误=20/8=2.5。95%置信区间=105±1.96×2.5=105±4.9=[100.1, 109.9]。", explain: "大样本均值置信区间。" },
{ chapter: "ch4", type: "计算题", q: "已知总体标准差σ=15，样本量n=100，样本均值x̄=80。求总体均值μ的95%置信区间。", refAnswer: "标准误=15/10=1.5。置信区间=80±1.96×1.5=80±2.94=[77.06, 82.94]。", explain: "大样本均值置信区间。" },
{ chapter: "ch4", type: "计算题", q: "已知总体标准差σ=10，样本量n=25，样本均值x̄=50。求总体均值μ的99%置信区间。", refAnswer: "标准误=10/5=2。99%置信区间=50±2.58×2=50±5.16=[44.84, 55.16]。", explain: "大样本均值置信区间。" },

{ chapter: "ch5", type: "判断题", q: "置信区间的中心是总体参数。", options: ["正确", "错误"], answer: 1, explain: "置信区间以样本统计量为中心。" },
{ chapter: "ch5", type: "判断题", q: "置信水平为95%意味着总体参数有95%的概率落在区间内。", options: ["正确", "错误"], answer: 1, explain: "置信水平是频率意义，不是概率意义。" },
{ chapter: "ch5", type: "判断题", q: "重复抽样构造的95%置信区间中约95%包含总体参数。", options: ["正确", "错误"], answer: 0, explain: "置信水平的正确解释。" },
{ chapter: "ch5", type: "判断题", q: "样本比例置信区间使用Z分布。", options: ["正确", "错误"], answer: 0, explain: "比例置信区间用Z分布。" },
{ chapter: "ch5", type: "判断题", q: "总体比例未知时，p̂通常取0.5。", options: ["正确", "错误"], answer: 0, explain: "p̂=0.5时方差最大，最保守。" },
{ chapter: "ch5", type: "判断题", q: "无偏样本方差的分母是n。", options: ["正确", "错误"], answer: 1, explain: "无偏样本方差分母为n-1。" },
{ chapter: "ch5", type: "判断题", q: "有偏样本方差的分母是n。", options: ["正确", "错误"], answer: 0, explain: "有偏样本方差分母为n。" },
{ chapter: "ch5", type: "判断题", q: "样本均值的标准误为σ/√n。", options: ["正确", "错误"], answer: 0, explain: "标准误公式。" },
{ chapter: "ch5", type: "判断题", q: "样本比例的标准误为√(p(1-p)/n)。", options: ["正确", "错误"], answer: 0, explain: "样本比例标准误公式。" },
{ chapter: "ch5", type: "判断题", q: "点估计给出数值，区间估计给出区间。", options: ["正确", "错误"], answer: 0, explain: "点估计与区间估计的区别。" },
{ chapter: "ch5", type: "判断题", q: "矩估计法通过最大化似然函数求解参数。", options: ["正确", "错误"], answer: 1, explain: "矩估计法通过样本矩等于总体矩求解。" },
{ chapter: "ch5", type: "判断题", q: "最大似然估计法通过最大化似然函数求解参数。", options: ["正确", "错误"], answer: 0, explain: "最大似然估计的定义。" },
{ chapter: "ch5", type: "判断题", q: "样本量公式n=(Z(α/2)·σ/E)²用于确定估计总体均值所需的样本量。", options: ["正确", "错误"], answer: 0, explain: "样本量确定公式。" },
{ chapter: "ch5", type: "判断题", q: "估计总体均值时，若σ未知，可用样本标准差s估计。", options: ["正确", "错误"], answer: 0, explain: "用s估计σ。" },
{ chapter: "ch5", type: "判断题", q: "置信水平为99%的置信区间比95%的置信区间窄。", options: ["正确", "错误"], answer: 1, explain: "99%区间比95%宽。" },
{ chapter: "ch5", type: "判断题", q: "样本量从100增加到400，置信区间宽度变为原来的1/2。", options: ["正确", "错误"], answer: 0, explain: "区间宽度与√n成反比。" },

// ===== 简答题 10 题 =====
{ chapter: "ch5", type: "简答题", q: "简述点估计与区间估计的区别。", refAnswer: "点估计用一个数值估计总体参数，如用样本均值估计总体均值；区间估计给出一个区间，并附有置信水平，说明估计的可靠程度。区间估计比点估计提供了更多信息。", explain: "点估计给数值，区间估计给区间和可靠程度。" },
{ chapter: "ch5", type: "简答题", q: "简述估计量的三个评价标准。", refAnswer: "1. 无偏性：估计量的期望等于被估参数；2. 有效性：在所有无偏估计中方差最小；3. 一致性：样本量增大时估计量依概率收敛于参数。", explain: "无偏性、有效性、一致性。" },
{ chapter: "ch5", type: "简答题", q: "简述置信区间的含义。", refAnswer: "置信区间是以点估计为中心、以边际误差为半径构造的区间，表示在给定置信水平下，重复抽样构造的区间中有相应比例会包含总体参数。置信水平是频率意义，不是参数落在区间的概率。", explain: "置信区间的正确解释。" },
{ chapter: "ch5", type: "简答题", q: "简述影响置信区间宽度的因素。", refAnswer: "1. 样本量：样本量越大，区间越窄；2. 置信水平：置信水平越高，区间越宽；3. 总体标准差：标准差越大，区间越宽。", explain: "三个因素影响置信区间宽度。" },
{ chapter: "ch5", type: "简答题", q: "简述总体方差已知和未知时均值置信区间的区别。", refAnswer: "方差已知时使用Z分布，公式为x̄±Z(α/2)·σ/√n；方差未知且样本量较小时使用T分布，公式为x̄±t(α/2,n-1)·s/√n；方差未知但样本量较大时可用Z近似。", explain: "方差已知用Z，未知小样本用T。" },
{ chapter: "ch5", type: "简答题", q: "简述总体比例置信区间的构造方法。", refAnswer: "总体比例置信区间为p̂±Z(α/2)·√(p̂(1-p̂)/n)，其中p̂为样本比例，n为样本量。当p̂未知时，通常取p̂=0.5以使样本量估计最保守。", explain: "比例置信区间公式。" },
{ chapter: "ch5", type: "简答题", q: "简述总体方差置信区间的构造方法。", refAnswer: "总体方差置信区间为[(n-1)s²/χ²(α/2,n-1), (n-1)s²/χ²(1-α/2,n-1)]，使用卡方分布。其中s²为样本方差，n为样本量。", explain: "方差置信区间用卡方分布。" },
{ chapter: "ch5", type: "简答题", q: "简述确定样本量的方法。", refAnswer: "估计总体均值时，样本量公式为n=(Z(α/2)·σ/E)²，其中E为允许的边际误差。若σ未知，可用样本标准差s估计；估计总体比例时，若p̂未知，通常取p̂=0.5。", explain: "样本量确定公式。" },
{ chapter: "ch5", type: "简答题", q: "简述无偏性、有效性、一致性的区别。", refAnswer: "无偏性关注估计量的期望是否等于参数；有效性关注无偏估计中方差是否最小；一致性关注样本量增大时估计量是否依概率收敛于参数。三者从不同角度评价估计量的优劣。", explain: "三个评价标准的区别。" },
{ chapter: "ch5", type: "简答题", q: "简述参数估计在智能决策中的应用。", refAnswer: "参数估计通过样本数据推断总体特征，为决策提供依据。例如在电商中估计用户平均消费额、在金融风控中估计违约概率、在医疗中估计疗效比例，都是参数估计的应用。结合AI工具，可以实现自适应估计与实时决策支持。", explain: "参数估计在智能决策中的应用。" },

// ===== 计算题 40 题 =====
{ chapter: "ch5", type: "计算题", q: "已知总体标准差σ=10，样本量n=25，样本均值x̄=50。求总体均值μ的95%置信区间。", refAnswer: "标准误=σ/√n=10/5=2。95%置信区间=50±1.96×2=50±3.92=[46.08, 53.92]。", explain: "方差已知用Z分布。" },
{ chapter: "ch5", type: "计算题", q: "已知总体标准差σ=15，样本量n=100，样本均值x̄=80。求总体均值μ的95%置信区间。", refAnswer: "标准误=15/10=1.5。置信区间=80±1.96×1.5=80±2.94=[77.06, 82.94]。", explain: "方差已知用Z分布。" },
{ chapter: "ch5", type: "计算题", q: "已知总体标准差σ=20，样本量n=64，样本均值x̄=100。求总体均值μ的99%置信区间。", refAnswer: "标准误=20/8=2.5。置信区间=100±2.58×2.5=100±6.45=[93.55, 106.45]。", explain: "方差已知用Z分布。" },
{ chapter: "ch5", type: "计算题", q: "已知总体标准差σ=12，样本量n=36，样本均值x̄=60。求总体均值μ的90%置信区间。", refAnswer: "标准误=12/6=2。置信区间=60±1.645×2=60±3.29=[56.71, 63.29]。", explain: "方差已知用Z分布。" },
{ chapter: "ch5", type: "计算题", q: "已知总体标准差σ=8，样本量n=49，样本均值x̄=40。求总体均值μ的95%置信区间。", refAnswer: "标准误=8/7≈1.143。置信区间=40±1.96×1.143=40±2.24=[37.76, 42.24]。", explain: "方差已知用Z分布。" },
{ chapter: "ch5", type: "计算题", q: "某样本n=25，样本均值x̄=50，样本标准差s=10。求总体均值μ的95%置信区间（t₀.₀₂₅(24)=2.064）。", refAnswer: "标准误=s/√n=10/5=2。置信区间=50±2.064×2=50±4.128=[45.872, 54.128]。", explain: "方差未知小样本用T分布。" },
{ chapter: "ch5", type: "计算题", q: "某样本n=16，样本均值x̄=30，样本标准差s=8。求总体均值μ的95%置信区间（t₀.₀₂₅(15)=2.131）。", refAnswer: "标准误=8/4=2。置信区间=30±2.131×2=30±4.262=[25.738, 34.262]。", explain: "方差未知小样本用T分布。" },
{ chapter: "ch5", type: "计算题", q: "某样本n=20，样本均值x̄=100，样本标准差s=15。求总体均值μ的99%置信区间（t₀.₀₀₅(19)=2.861）。", refAnswer: "标准误=15/√20≈3.354。置信区间=100±2.861×3.354=100±9.596=[90.404, 109.596]。", explain: "方差未知小样本用T分布。" },
{ chapter: "ch5", type: "计算题", q: "某样本n=10，样本均值x̄=25，样本标准差s=5。求总体均值μ的95%置信区间（t₀.₀₂₅(9)=2.262）。", refAnswer: "标准误=5/√10≈1.581。置信区间=25±2.262×1.581=25±3.576=[21.424, 28.576]。", explain: "方差未知小样本用T分布。" },
{ chapter: "ch5", type: "计算题", q: "某样本n=30，样本均值x̄=75，样本标准差s=12。求总体均值μ的95%置信区间（t₀.₀₂₅(29)=2.045）。", refAnswer: "标准误=12/√30≈2.191。置信区间=75±2.045×2.191=75±4.481=[70.519, 79.481]。", explain: "方差未知小样本用T分布。" },
{ chapter: "ch5", type: "计算题", q: "某样本n=100，样本比例p̂=0.4。求总体比例p的95%置信区间。", refAnswer: "标准误=√(0.4×0.6/100)=√0.0024≈0.049。置信区间=0.4±1.96×0.049=0.4±0.096=[0.304, 0.496]。", explain: "比例置信区间用Z分布。" },
{ chapter: "ch5", type: "计算题", q: "某样本n=400，样本比例p̂=0.5。求总体比例p的95%置信区间。", refAnswer: "标准误=√(0.5×0.5/400)=√0.000625=0.025。置信区间=0.5±1.96×0.025=0.5±0.049=[0.451, 0.549]。", explain: "比例置信区间用Z分布。" },
{ chapter: "ch5", type: "计算题", q: "某样本n=900，样本比例p̂=0.3。求总体比例p的99%置信区间。", refAnswer: "标准误=√(0.3×0.7/900)≈0.0153。置信区间=0.3±2.58×0.0153=0.3±0.0395=[0.2605, 0.3395]。", explain: "比例置信区间用Z分布。" },
{ chapter: "ch5", type: "计算题", q: "某样本n=250，样本比例p̂=0.6。求总体比例p的90%置信区间。", refAnswer: "标准误=√(0.6×0.4/250)=√0.00096≈0.031。置信区间=0.6±1.645×0.031=0.6±0.051=[0.549, 0.651]。", explain: "比例置信区间用Z分布。" },
{ chapter: "ch5", type: "计算题", q: "某样本n=500，样本比例p̂=0.45。求总体比例p的95%置信区间。", refAnswer: "标准误=√(0.45×0.55/500)=√0.000495≈0.0222。置信区间=0.45±1.96×0.0222=0.45±0.0435=[0.4065, 0.4935]。", explain: "比例置信区间用Z分布。" },
{ chapter: "ch5", type: "计算题", q: "某样本n=20，样本方差s²=25。求总体方差σ²的95%置信区间（χ²₀.₀₂₅(19)=32.85，χ²₀.₉₇₅(19)=8.91）。", refAnswer: "下限=(n-1)s²/χ²(α/2,n-1)=19×25/32.85≈14.46；上限=19×25/8.91≈53.31。区间为[14.46, 53.31]。", explain: "方差置信区间用卡方分布。" },
{ chapter: "ch5", type: "计算题", q: "某样本n=30，样本方差s²=16。求总体方差σ²的95%置信区间（χ²₀.₀₂₅(29)=45.72，χ²₀.₉₇₅(29)=16.05）。", refAnswer: "下限=29×16/45.72≈10.15；上限=29×16/16.05≈28.91。区间为[10.15, 28.91]。", explain: "方差置信区间用卡方分布。" },
{ chapter: "ch5", type: "计算题", q: "某样本n=15，样本方差s²=9。求总体方差σ²的99%置信区间（χ²₀.₀₀₅(14)=31.32，χ²₀.₉₉₅(14)=4.07）。", refAnswer: "下限=14×9/31.32≈4.02；上限=14×9/4.07≈30.96。区间为[4.02, 30.96]。", explain: "方差置信区间用卡方分布。" },
{ chapter: "ch5", type: "计算题", q: "某样本n=25，样本方差s²=100。求总体方差σ²的90%置信区间（χ²₀.₀₅(24)=36.42，χ²₀.₉₅(24)=13.85）。", refAnswer: "下限=24×100/36.42≈65.90；上限=24×100/13.85≈173.29。区间为[65.90, 173.29]。", explain: "方差置信区间用卡方分布。" },
{ chapter: "ch5", type: "计算题", q: "某样本n=40，样本方差s²=36。求总体方差σ²的95%置信区间（χ²₀.₀₂₅(39)=58.12，χ²₀.₉₇₅(39)=23.65）。", refAnswer: "下限=39×36/58.12≈24.16；上限=39×36/23.65≈59.37。区间为[24.16, 59.37]。", explain: "方差置信区间用卡方分布。" },
{ chapter: "ch5", type: "计算题", q: "若要求估计总体均值时边际误差不超过2，总体标准差σ=10，置信水平95%，求所需样本量。", refAnswer: "n=(Z(α/2)·σ/E)²=(1.96×10/2)²=(9.8)²≈97，向上取整为97。", explain: "样本量确定公式。" },
{ chapter: "ch5", type: "计算题", q: "若要求估计总体均值时边际误差不超过3，总体标准差σ=15，置信水平95%，求所需样本量。", refAnswer: "n=(1.96×15/3)²=(9.8)²≈97，向上取整为97。", explain: "样本量确定公式。" },
{ chapter: "ch5", type: "计算题", q: "若要求估计总体均值时边际误差不超过5，总体标准差σ=20，置信水平99%，求所需样本量。", refAnswer: "n=(2.58×20/5)²=(10.32)²≈107，向上取整为107。", explain: "样本量确定公式。" },
{ chapter: "ch5", type: "计算题", q: "若要求估计总体均值时边际误差不超过1，总体标准差σ=5，置信水平90%，求所需样本量。", refAnswer: "n=(1.645×5/1)²=(8.225)²≈68，向上取整为68。", explain: "样本量确定公式。" },
{ chapter: "ch5", type: "计算题", q: "若要求估计总体比例时边际误差不超过0.05，置信水平95%，p̂未知，求所需样本量。", refAnswer: "p̂取0.5。n=(1.96²×0.5×0.5)/0.05²=0.9604/0.0025≈385，向上取整为385。", explain: "比例样本量公式。" },
{ chapter: "ch5", type: "计算题", q: "若要求估计总体比例时边际误差不超过0.03，置信水平95%，p̂未知，求所需样本量。", refAnswer: "n=(1.96²×0.5×0.5)/0.03²=0.9604/0.0009≈1068，向上取整为1068。", explain: "比例样本量公式。" },
{ chapter: "ch5", type: "计算题", q: "若要求估计总体比例时边际误差不超过0.04，置信水平99%，p̂未知，求所需样本量。", refAnswer: "n=(2.58²×0.5×0.5)/0.04²=1.6641/0.0016≈1041，向上取整为1041。", explain: "比例样本量公式。" },
{ chapter: "ch5", type: "计算题", q: "若要求估计总体比例时边际误差不超过0.02，置信水平95%，p̂=0.3，求所需样本量。", refAnswer: "n=(1.96²×0.3×0.7)/0.02²=(3.8416×0.21)/0.0004≈2017，向上取整为2017。", explain: "比例样本量公式。" },
{ chapter: "ch5", type: "计算题", q: "某样本n=50，样本均值x̄=200，样本标准差s=25。求总体均值μ的95%置信区间（t₀.₀₂₅(49)=2.010）。", refAnswer: "标准误=25/√50≈3.536。置信区间=200±2.010×3.536=200±7.108=[192.892, 207.108]。", explain: "方差未知小样本用T分布。" },
{ chapter: "ch5", type: "计算题", q: "某样本n=100，样本均值x̄=500，样本标准差s=50。求总体均值μ的95%置信区间（用Z近似）。", refAnswer: "标准误=50/10=5。置信区间=500±1.96×5=500±9.8=[490.2, 509.8]。", explain: "大样本用Z近似。" },
{ chapter: "ch5", type: "计算题", q: "某样本n=200，样本均值x̄=60，样本标准差s=12。求总体均值μ的99%置信区间（用Z近似）。", refAnswer: "标准误=12/√200≈0.849。置信区间=60±2.58×0.849=60±2.19=[57.81, 62.19]。", explain: "大样本用Z近似。" },
{ chapter: "ch5", type: "计算题", q: "某样本n=150，样本比例p̂=0.35。求总体比例p的95%置信区间。", refAnswer: "标准误=√(0.35×0.65/150)≈0.0389。置信区间=0.35±1.96×0.0389=0.35±0.0762=[0.2738, 0.4262]。", explain: "比例置信区间用Z分布。" },
{ chapter: "ch5", type: "计算题", q: "某样本n=80，样本比例p̂=0.7。求总体比例p的99%置信区间。", refAnswer: "标准误=√(0.7×0.3/80)≈0.0512。置信区间=0.7±2.58×0.0512=0.7±0.1321=[0.5679, 0.8321]。", explain: "比例置信区间用Z分布。" },
{ chapter: "ch5", type: "计算题", q: "某样本n=60，样本比例p̂=0.25。求总体比例p的90%置信区间。", refAnswer: "标准误=√(0.25×0.75/60)≈0.0559。置信区间=0.25±1.645×0.0559=0.25±0.092=[0.158, 0.342]。", explain: "比例置信区间用Z分布。" },
{ chapter: "ch5", type: "计算题", q: "某样本n=25，样本方差s²=64。求总体方差σ²的95%置信区间（χ²₀.₀₂₅(24)=39.36，χ²₀.₉₇₅(24)=12.40）。", refAnswer: "下限=24×64/39.36≈39.02；上限=24×64/12.40≈123.87。区间为[39.02, 123.87]。", explain: "方差置信区间用卡方分布。" },
{ chapter: "ch5", type: "计算题", q: "某样本n=18，样本方差s²=20。求总体方差σ²的90%置信区间（χ²₀.₀₅(17)=27.59，χ²₀.₉₅(17)=8.67）。", refAnswer: "下限=17×20/27.59≈12.32；上限=17×20/8.67≈39.22。区间为[12.32, 39.22]。", explain: "方差置信区间用卡方分布。" },
{ chapter: "ch5", type: "计算题", q: "某样本n=35，样本方差s²=50。求总体方差σ²的99%置信区间（χ²₀.₀₀₅(34)=61.16，χ²₀.₉₉₅(34)=16.03）。", refAnswer: "下限=34×50/61.16≈27.80；上限=34×50/16.03≈106.05。区间为[27.80, 106.05]。", explain: "方差置信区间用卡方分布。" },
{ chapter: "ch5", type: "计算题", q: "某样本n=12，样本方差s²=16。求总体方差σ²的95%置信区间（χ²₀.₀₂₅(11)=21.92，χ²₀.₉₇₅(11)=3.82）。", refAnswer: "下限=11×16/21.92≈8.03；上限=11×16/3.82≈46.07。区间为[8.03, 46.07]。", explain: "方差置信区间用卡方分布。" },
{ chapter: "ch5", type: "计算题", q: "若要求估计总体均值时边际误差不超过0.5，总体标准差σ=3，置信水平95%，求所需样本量。", refAnswer: "n=(1.96×3/0.5)²=(11.76)²≈139，向上取整为139。", explain: "样本量确定公式。" },
{ chapter: "ch5", type: "计算题", q: "若要求估计总体均值时边际误差不超过2，总体标准差σ=12，置信水平99%，求所需样本量。", refAnswer: "n=(2.58×12/2)²=(15.48)²≈240，向上取整为240。", explain: "样本量确定公式。" },
// ===== 应用题 60 题 =====
{ chapter: "ch5", type: "应用题", q: "某电商平台想估计用户的平均月消费额。随机抽取100名用户，样本均值x̄=800元，样本标准差s=200元。请构造总体平均月消费额μ的95%置信区间，并说明其管理含义。", refAnswer: "标准误=s/√n=200/10=20；95%置信区间=800±1.96×20=800±39.2=[760.8, 839.2]。管理含义：有95%的把握认为平台用户的平均月消费额在760.8元到839.2元之间，可用于制定营销预算和用户分层策略。", explain: "大样本均值置信区间，结合业务解读。" },
{ chapter: "ch5", type: "应用题", q: "某医疗器械企业想估计新工艺下产品的平均生产时间。随机抽取16件产品，样本均值x̄=45分钟，样本标准差s=8分钟。请构造总体平均生产时间μ的95%置信区间（t₀.₀₂₅(15)=2.131）。", refAnswer: "标准误=8/4=2；置信区间=45±2.131×2=45±4.262=[40.738, 49.262]。说明：有95%的把握认为新工艺平均生产时间在40.74到49.26分钟之间。", explain: "小样本T分布置信区间。" },
{ chapter: "ch5", type: "应用题", q: "某金融风控团队想估计贷款违约率。随机抽取400笔贷款，发现40笔违约。请构造总体违约率p的95%置信区间。", refAnswer: "p̂=40/400=0.1；标准误=√(0.1×0.9/400)=√0.000225=0.015；置信区间=0.1±1.96×0.015=0.1±0.0294=[0.0706, 0.1294]。说明：有95%的把握认为违约率在7.06%到12.94%之间。", explain: "比例置信区间，结合风控决策。" },
{ chapter: "ch5", type: "应用题", q: "某零售企业想估计顾客满意度评分。随机抽取25名顾客，样本均值x̄=4.2分（满分5分），样本标准差s=0.6分。请构造总体平均满意度μ的95%置信区间（t₀.₀₂₅(24)=2.064）。", refAnswer: "标准误=0.6/5=0.12；置信区间=4.2±2.064×0.12=4.2±0.2477=[3.952, 4.448]。说明：有95%的把握认为顾客平均满意度在3.95到4.45分之间。", explain: "小样本均值置信区间。" },
{ chapter: "ch5", type: "应用题", q: "某电商平台想确定估计用户平均订单金额所需的样本量。已知总体标准差σ=50元，要求边际误差不超过5元，置信水平95%。求所需样本量。", refAnswer: "n=(1.96×50/5)²=(19.6)²≈385，向上取整为385。说明：至少需要抽取385名用户。", explain: "样本量确定，结合业务成本考虑。" },
{ chapter: "ch5", type: "应用题", q: "某医疗研究团队想估计某疗法的有效率。预调查显示有效率约为0.7，要求边际误差不超过0.05，置信水平95%。求所需样本量。", refAnswer: "n=(1.96²×0.7×0.3)/0.05²=(3.8416×0.21)/0.0025≈323，向上取整为323。说明：至少需要323名患者。", explain: "比例样本量确定。" },
{ chapter: "ch5", type: "应用题", q: "某制造企业想估计产品平均寿命。随机抽取36件产品，样本均值x̄=1200小时，样本标准差s=150小时。请构造总体平均寿命μ的99%置信区间。", refAnswer: "标准误=150/6=25；置信区间=1200±2.58×25=1200±64.5=[1135.5, 1264.5]。说明：有99%的把握认为产品平均寿命在1135.5到1264.5小时之间。", explain: "大样本均值置信区间。" },
{ chapter: "ch5", type: "应用题", q: "某在线教育平台想估计课程完成率。随机抽取500名学员，发现150人完成课程。请构造总体完成率p的95%置信区间，并说明平台应如何利用该结果。", refAnswer: "p̂=0.3；标准误=√(0.3×0.7/500)≈0.0205；置信区间=0.3±1.96×0.0205=0.3±0.0402=[0.2598, 0.3402]。平台可据此判断完成率在26%到34%之间，若低于目标值，需优化课程设计或增加学习激励。", explain: "比例置信区间，结合运营决策。" },
{ chapter: "ch5", type: "应用题", q: "某银行想估计客户平均存款额。随机抽取64名客户，样本均值x̄=50000元，样本标准差s=12000元。请构造总体平均存款额μ的95%置信区间。", refAnswer: "标准误=12000/8=1500；置信区间=50000±1.96×1500=50000±2940=[47060, 52940]。说明：有95%的把握认为客户平均存款额在4.706万到5.294万元之间。", explain: "大样本均值置信区间。" },
{ chapter: "ch5", type: "应用题", q: "某社交平台想估计用户日均使用时长。随机抽取100名用户，样本均值x̄=90分钟，样本标准差s=30分钟。请构造总体平均使用时长μ的90%置信区间。", refAnswer: "标准误=30/10=3；置信区间=90±1.645×3=90±4.935=[85.065, 94.935]。说明：有90%的把握认为用户日均使用时长在85.07到94.94分钟之间。", explain: "大样本均值置信区间。" },
{ chapter: "ch5", type: "应用题", q: "某物流公司想估计包裹平均配送时间。随机抽取25个包裹，样本均值x̄=2.5天，样本标准差s=0.8天。请构造总体平均配送时间μ的95%置信区间（t₀.₀₂₅(24)=2.064），并说明物流优化的决策依据。", refAnswer: "标准误=0.8/5=0.16；置信区间=2.5±2.064×0.16=2.5±0.330=[2.170, 2.830]。若公司目标为2天内送达，则当前配送时间可能超标，需优化路线或增加配送频次。", explain: "小样本均值置信区间，结合物流决策。" },
{ chapter: "ch5", type: "应用题", q: "某保险公司想估计理赔金额的方差。随机抽取20笔理赔，样本方差s²=10000。请构造总体方差σ²的95%置信区间（χ²₀.₀₂₅(19)=32.85，χ²₀.₉₇₅(19)=8.91）。", refAnswer: "下限=19×10000/32.85≈5784；上限=19×10000/8.91≈21324。区间为[5784, 21324]。说明：有95%的把握认为理赔金额方差在5784到21324之间，可用于评估风险波动。", explain: "方差置信区间，结合保险风险管理。" },
{ chapter: "ch5", type: "应用题", q: "某制造企业想估计零件直径的方差。随机抽取30个零件，样本方差s²=0.04。请构造总体方差σ²的95%置信区间（χ²₀.₀₂₅(29)=45.72，χ²₀.₉₇₅(29)=16.05）。", refAnswer: "下限=29×0.04/45.72≈0.0254；上限=29×0.04/16.05≈0.0723。区间为[0.0254, 0.0723]。说明：有95%的把握认为直径方差在此范围内，可用于质量控制。", explain: "方差置信区间，结合质量控制。" },
{ chapter: "ch5", type: "应用题", q: "某市场调研公司想估计某品牌知名度。随机抽取600人，发现240人知道该品牌。请构造总体知名度p的95%置信区间，并说明品牌推广策略。", refAnswer: "p̂=0.4；标准误=√(0.4×0.6/600)≈0.02；置信区间=0.4±1.96×0.02=0.4±0.0392=[0.3608, 0.4392]。若目标知名度为50%，当前结果未达标，需加大推广力度。", explain: "比例置信区间，结合营销决策。" },
{ chapter: "ch5", type: "应用题", q: "某医院想估计患者平均住院天数。随机抽取49名患者，样本均值x̄=8天，样本标准差s=2天。请构造总体平均住院天数μ的95%置信区间。", refAnswer: "标准误=2/7≈0.286；置信区间=8±1.96×0.286=8±0.560=[7.440, 8.560]。说明：有95%的把握认为平均住院天数在7.44到8.56天之间。", explain: "大样本均值置信区间。" },
{ chapter: "ch5", type: "应用题", q: "某电商平台想估计用户复购率。随机抽取300名用户，发现90人复购。请构造总体复购率p的99%置信区间。", refAnswer: "p̂=0.3；标准误=√(0.3×0.7/300)≈0.0265；置信区间=0.3±2.58×0.0265=0.3±0.0684=[0.2316, 0.3684]。说明：有99%的把握认为复购率在23.16%到36.84%之间。", explain: "比例置信区间，99%置信水平。" },
{ chapter: "ch5", type: "应用题", q: "某教育机构想估计学生平均成绩。随机抽取16名学生，样本均值x̄=75分，样本标准差s=10分。请构造总体平均成绩μ的95%置信区间（t₀.₀₂₅(15)=2.131）。", refAnswer: "标准误=10/4=2.5；置信区间=75±2.131×2.5=75±5.328=[69.672, 80.328]。说明：有95%的把握认为学生平均成绩在69.67到80.33分之间。", explain: "小样本均值置信区间。" },
{ chapter: "ch5", type: "应用题", q: "某电商平台想估计用户平均浏览商品数。随机抽取100名用户，样本均值x̄=15件，样本标准差s=5件。请构造总体平均浏览数μ的95%置信区间。", refAnswer: "标准误=5/10=0.5；置信区间=15±1.96×0.5=15±0.98=[14.02, 15.98]。说明：有95%的把握认为平均浏览商品数在14.02到15.98件之间。", explain: "大样本均值置信区间。" },
{ chapter: "ch5", type: "应用题", q: "某金融平台想估计用户平均投资金额。随机抽取81名用户，样本均值x̄=20000元，样本标准差s=8000元。请构造总体平均投资金额μ的95%置信区间。", refAnswer: "标准误=8000/9≈888.9；置信区间=20000±1.96×888.9=20000±1742.2=[18257.8, 21742.2]。说明：有95%的把握认为平均投资金额在1.826万到2.174万元之间。", explain: "大样本均值置信区间。" },
{ chapter: "ch5", type: "应用题", q: "某平台想确定估计用户平均点击率所需的样本量。已知总体标准差σ=0.1，要求边际误差不超过0.01，置信水平95%。求所需样本量。", refAnswer: "n=(1.96×0.1/0.01)²=(19.6)²≈385，向上取整为385。说明：至少需要385个观测。", explain: "样本量确定，用于点击率估计。" },
{ chapter: "ch5", type: "应用题", q: "某电商想估计促销活动的转化率。要求边际误差不超过0.02，置信水平95%，p̂未知。求所需样本量。", refAnswer: "p̂取0.5。n=(1.96²×0.5×0.5)/0.02²=0.9604/0.0004=2401，向上取整为2401。说明：至少需要2401个样本。", explain: "比例样本量确定。" },
{ chapter: "ch5", type: "应用题", q: "某制造企业想估计产品合格率。随机抽取200件，发现190件合格。请构造总体合格率p的95%置信区间，并说明质量控制决策。", refAnswer: "p̂=0.95；标准误=√(0.95×0.05/200)≈0.0154；置信区间=0.95±1.96×0.0154=0.95±0.0302=[0.9198, 0.9802]。若企业目标合格率为98%，则当前可能未达标，需改进工艺。", explain: "比例置信区间，结合质量控制。" },
{ chapter: "ch5", type: "应用题", q: "某医院想估计手术成功率。随机抽取50例手术，成功45例。请构造总体成功率p的95%置信区间。", refAnswer: "p̂=0.9；标准误=√(0.9×0.1/50)≈0.0424；置信区间=0.9±1.96×0.0424=0.9±0.0831=[0.8169, 0.9831]。说明：有95%的把握认为手术成功率在81.69%到98.31%之间。", explain: "比例置信区间，结合医疗决策。" },
{ chapter: "ch5", type: "应用题", q: "某电商平台想估计用户平均客单价。随机抽取144笔订单，样本均值x̄=250元，样本标准差s=60元。请构造总体平均客单价μ的95%置信区间。", refAnswer: "标准误=60/12=5；置信区间=250±1.96×5=250±9.8=[240.2, 259.8]。说明：有95%的把握认为平均客单价在240.2到259.8元之间。", explain: "大样本均值置信区间。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均停留时长。随机抽取36名用户，样本均值x̄=120秒，样本标准差s=30秒。请构造总体平均停留时长μ的99%置信区间。", refAnswer: "标准误=30/6=5；置信区间=120±2.58×5=120±12.9=[107.1, 132.9]。说明：有99%的把握认为平均停留时长在107.1到132.9秒之间。", explain: "大样本均值置信区间。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均购买次数。随机抽取49名用户，样本均值x̄=3次，样本标准差s=1.2次。请构造总体平均购买次数μ的95%置信区间（t₀.₀₂₅(48)=2.011）。", refAnswer: "标准误=1.2/7≈0.171；置信区间=3±2.011×0.171=3±0.344=[2.656, 3.344]。说明：有95%的把握认为平均购买次数在2.66到3.34次之间。", explain: "T分布均值置信区间。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均退款率。随机抽取500笔订单，发现25笔退款。请构造总体退款率p的95%置信区间，并说明风控建议。", refAnswer: "p̂=0.05；标准误=√(0.05×0.95/500)≈0.00975；置信区间=0.05±1.96×0.00975=0.05±0.0191=[0.0309, 0.0691]。若退款率目标低于3%，当前可能偏高，需加强风控。", explain: "比例置信区间，结合风控决策。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均分享次数。随机抽取100名用户，样本均值x̄=2次，样本标准差s=0.8次。请构造总体平均分享次数μ的95%置信区间。", refAnswer: "标准误=0.8/10=0.08；置信区间=2±1.96×0.08=2±0.157=[1.843, 2.157]。说明：有95%的把握认为平均分享次数在1.84到2.16次之间。", explain: "大样本均值置信区间。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均收藏商品数。随机抽取64名用户，样本均值x̄=8件，样本标准差s=2.4件。请构造总体平均收藏数μ的95%置信区间。", refAnswer: "标准误=2.4/8=0.3；置信区间=8±1.96×0.3=8±0.588=[7.412, 8.588]。说明：有95%的把握认为平均收藏数在7.41到8.59件之间。", explain: "大样本均值置信区间。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均评论数。随机抽取25名用户，样本均值x̄=1.5条，样本标准差s=0.5条。请构造总体平均评论数μ的95%置信区间（t₀.₀₂₅(24)=2.064）。", refAnswer: "标准误=0.5/5=0.1；置信区间=1.5±2.064×0.1=1.5±0.206=[1.294, 1.706]。说明：有95%的把握认为平均评论数在1.29到1.71条之间。", explain: "小样本均值置信区间。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均点赞数。随机抽取81名用户，样本均值x̄=5次，样本标准差s=1.5次。请构造总体平均点赞数μ的90%置信区间。", refAnswer: "标准误=1.5/9≈0.167；置信区间=5±1.645×0.167=5±0.275=[4.725, 5.275]。说明：有90%的把握认为平均点赞数在4.73到5.28次之间。", explain: "大样本均值置信区间。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均观看视频数。随机抽取100名用户，样本均值x̄=12个，样本标准差s=4个。请构造总体平均观看数μ的95%置信区间。", refAnswer: "标准误=4/10=0.4；置信区间=12±1.96×0.4=12±0.784=[11.216, 12.784]。说明：有95%的把握认为平均观看视频数在11.22到12.78个之间。", explain: "大样本均值置信区间。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均搜索次数。随机抽取49名用户，样本均值x̄=6次，样本标准差s=2次。请构造总体平均搜索次数μ的95%置信区间。", refAnswer: "标准误=2/7≈0.286；置信区间=6±1.96×0.286=6±0.560=[5.440, 6.560]。说明：有95%的把握认为平均搜索次数在5.44到6.56次之间。", explain: "大样本均值置信区间。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均下单金额的方差。随机抽取25笔订单，样本方差s²=400。请构造总体方差σ²的95%置信区间（χ²₀.₀₂₅(24)=39.36，χ²₀.₉₇₅(24)=12.40）。", refAnswer: "下限=24×400/39.36≈243.9；上限=24×400/12.40≈774.2。区间为[243.9, 774.2]。说明：有95%的把握认为订单金额方差在此范围内，可用于风险评估。", explain: "方差置信区间，结合风险决策。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户年龄的方差。随机抽取30名用户，样本方差s²=100。请构造总体方差σ²的95%置信区间（χ²₀.₀₂₅(29)=45.72，χ²₀.₉₇₅(29)=16.05）。", refAnswer: "下限=29×100/45.72≈63.4；上限=29×100/16.05≈180.7。区间为[63.4, 180.7]。说明：有95%的把握认为年龄方差在此范围内，可用于用户画像。", explain: "方差置信区间，结合用户画像。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户收入的方差。随机抽取20名用户，样本方差s²=250000。请构造总体方差σ²的99%置信区间（χ²₀.₀₀₅(19)=38.58，χ²₀.₉₉₅(19)=6.84）。", refAnswer: "下限=19×250000/38.58≈123122；上限=19×250000/6.84≈694444。区间为[123122, 694444]。说明：有99%的把握认为收入方差在此范围内，可用于市场分层。", explain: "方差置信区间，99%置信水平。" },
{ chapter: "ch5", type: "应用题", q: "某电商想估计用户平均消费金额。随机抽取36名用户，样本均值x̄=600元，样本标准差s=150元。请构造总体平均消费金额μ的95%置信区间，并说明营销策略。", refAnswer: "标准误=150/6=25；置信区间=600±1.96×25=600±49=[551, 649]。说明：有95%的把握认为平均消费金额在551到649元之间，可据此制定满减门槛和优惠券面额。", explain: "大样本均值置信区间，结合营销决策。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均使用时长。随机抽取100名用户，样本均值x̄=45分钟，样本标准差s=15分钟。请构造总体平均使用时长μ的95%置信区间，并说明产品优化建议。", refAnswer: "标准误=15/10=1.5；置信区间=45±1.96×1.5=45±2.94=[42.06, 47.94]。说明：有95%的把握认为平均使用时长在42.06到47.94分钟之间，若目标为60分钟，需优化功能或增加内容。", explain: "大样本均值置信区间，结合产品决策。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均购买转化率。随机抽取500名访客，发现50人购买。请构造总体转化率p的95%置信区间，并说明运营建议。", refAnswer: "p̂=0.1；标准误=√(0.1×0.9/500)≈0.0134；置信区间=0.1±1.96×0.0134=0.1±0.0263=[0.0737, 0.1263]。若目标转化率为15%，当前未达标，需优化落地页和推荐算法。", explain: "比例置信区间，结合运营决策。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均复购间隔天数。随机抽取25名复购用户，样本均值x̄=30天，样本标准差s=6天。请构造总体平均复购间隔μ的95%置信区间（t₀.₀₂₅(24)=2.064）。", refAnswer: "标准误=6/5=1.2；置信区间=30±2.064×1.2=30±2.477=[27.523, 32.477]。说明：有95%的把握认为平均复购间隔在27.52到32.48天之间。", explain: "小样本均值置信区间。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均推荐人数。随机抽取64名用户，样本均值x̄=3人，样本标准差s=1.2人。请构造总体平均推荐人数μ的95%置信区间。", refAnswer: "标准误=1.2/8=0.15；置信区间=3±1.96×0.15=3±0.294=[2.706, 3.294]。说明：有95%的把握认为平均推荐人数在2.71到3.29人之间。", explain: "大样本均值置信区间。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均投诉率。随机抽取1000笔订单，发现20笔投诉。请构造总体投诉率p的95%置信区间，并说明服务改进建议。", refAnswer: "p̂=0.02；标准误=√(0.02×0.98/1000)≈0.00443；置信区间=0.02±1.96×0.00443=0.02±0.00868=[0.0113, 0.0287]。若目标投诉率低于1%，当前偏高，需改进物流和客服。", explain: "比例置信区间，结合服务决策。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均退货率。随机抽取800笔订单，发现40笔退货。请构造总体退货率p的99%置信区间。", refAnswer: "p̂=0.05；标准误=√(0.05×0.95/800)≈0.0077；置信区间=0.05±2.58×0.0077=0.05±0.0199=[0.0301, 0.0699]。说明：有99%的把握认为退货率在3.01%到6.99%之间。", explain: "比例置信区间，99%置信水平。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均签到天数。随机抽取49名用户，样本均值x̄=15天，样本标准差s=5天。请构造总体平均签到天数μ的95%置信区间。", refAnswer: "标准误=5/7≈0.714；置信区间=15±1.96×0.714=15±1.399=[13.601, 16.399]。说明：有95%的把握认为平均签到天数在13.60到16.40天之间。", explain: "大样本均值置信区间。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均优惠券使用率。随机抽取600名用户，发现180人使用。请构造总体使用率p的95%置信区间，并说明营销建议。", refAnswer: "p̂=0.3；标准误=√(0.3×0.7/600)≈0.0187；置信区间=0.3±1.96×0.0187=0.3±0.0367=[0.2633, 0.3367]。若目标使用率为40%，需优化优惠券发放策略。", explain: "比例置信区间，结合营销决策。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均观看直播时长。随机抽取36名用户，样本均值x̄=60分钟，样本标准差s=18分钟。请构造总体平均观看时长μ的95%置信区间。", refAnswer: "标准误=18/6=3；置信区间=60±1.96×3=60±5.88=[54.12, 65.88]。说明：有95%的把握认为平均观看时长在54.12到65.88分钟之间。", explain: "大样本均值置信区间。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均分享率。随机抽取400名用户，发现80人分享。请构造总体分享率p的95%置信区间。", refAnswer: "p̂=0.2；标准误=√(0.2×0.8/400)=0.02；置信区间=0.2±1.96×0.02=0.2±0.0392=[0.1608, 0.2392]。说明：有95%的把握认为分享率在16.08%到23.92%之间。", explain: "比例置信区间。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均收藏率。随机抽取500名用户，发现100人收藏。请构造总体收藏率p的99%置信区间。", refAnswer: "p̂=0.2；标准误=√(0.2×0.8/500)≈0.0179；置信区间=0.2±2.58×0.0179=0.2±0.0462=[0.1538, 0.2462]。说明：有99%的把握认为收藏率在15.38%到24.62%之间。", explain: "比例置信区间，99%置信水平。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均加购率。随机抽取300名用户，发现60人加购。请构造总体加购率p的95%置信区间。", refAnswer: "p̂=0.2；标准误=√(0.2×0.8/300)≈0.0231；置信区间=0.2±1.96×0.0231=0.2±0.0453=[0.1547, 0.2453]。说明：有95%的把握认为加购率在15.47%到24.53%之间。", explain: "比例置信区间。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均下单率。随机抽取800名访客，发现160人下单。请构造总体下单率p的95%置信区间，并说明运营建议。", refAnswer: "p̂=0.2；标准误=√(0.2×0.8/800)≈0.0141；置信区间=0.2±1.96×0.0141=0.2±0.0277=[0.1723, 0.2277]。若目标下单率为25%，需优化商品详情页和促销策略。", explain: "比例置信区间，结合运营决策。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均支付成功率。随机抽取600笔订单，成功540笔。请构造总体成功率p的95%置信区间。", refAnswer: "p̂=0.9；标准误=√(0.9×0.1/600)≈0.0122；置信区间=0.9±1.96×0.0122=0.9±0.024=[0.876, 0.924]。说明：有95%的把握认为支付成功率在87.6%到92.4%之间。", explain: "比例置信区间。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均取消订单率。随机抽取400笔订单，发现20笔取消。请构造总体取消率p的95%置信区间，并说明风控建议。", refAnswer: "p̂=0.05；标准误=√(0.05×0.95/400)≈0.0109；置信区间=0.05±1.96×0.0109=0.05±0.0214=[0.0286, 0.0714]。若目标取消率低于3%，当前偏高，需优化下单流程。", explain: "比例置信区间，结合风控决策。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均好评率。随机抽取500条评论，好评450条。请构造总体好评率p的95%置信区间。", refAnswer: "p̂=0.9；标准误=√(0.9×0.1/500)≈0.0134；置信区间=0.9±1.96×0.0134=0.9±0.0263=[0.8737, 0.9263]。说明：有95%的把握认为好评率在87.37%到92.63%之间。", explain: "比例置信区间。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均差评率。随机抽取400条评论，差评20条。请构造总体差评率p的99%置信区间。", refAnswer: "p̂=0.05；标准误=√(0.05×0.95/400)≈0.0109；置信区间=0.05±2.58×0.0109=0.05±0.0281=[0.0219, 0.0781]。说明：有99%的把握认为差评率在2.19%到7.81%之间。", explain: "比例置信区间，99%置信水平。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均推荐率。随机抽取300名用户，推荐150人。请构造总体推荐率p的95%置信区间，并说明运营建议。", refAnswer: "p̂=0.5；标准误=√(0.5×0.5/300)≈0.0289；置信区间=0.5±1.96×0.0289=0.5±0.0566=[0.4434, 0.5566]。若目标推荐率为60%，需加强用户激励和社交分享功能。", explain: "比例置信区间，结合运营决策。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均复购率。随机抽取600名用户，复购240人。请构造总体复购率p的95%置信区间。", refAnswer: "p̂=0.4；标准误=√(0.4×0.6/600)≈0.02；置信区间=0.4±1.96×0.02=0.4±0.0392=[0.3608, 0.4392]。说明：有95%的把握认为复购率在36.08%到43.92%之间。", explain: "比例置信区间。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均流失率。随机抽取500名用户，流失50人。请构造总体流失率p的95%置信区间，并说明留存策略。", refAnswer: "p̂=0.1；标准误=√(0.1×0.9/500)≈0.0134；置信区间=0.1±1.96×0.0134=0.1±0.0263=[0.0737, 0.1263]。若目标流失率低于5%，当前偏高，需加强用户召回和权益激励。", explain: "比例置信区间，结合留存决策。" },
{ chapter: "ch5", type: "应用题", q: "某平台想估计用户平均活跃率。随机抽取400名用户，活跃200人。请构造总体活跃率p的99%置信区间。", refAnswer: "p̂=0.5；标准误=√(0.5×0.5/400)=0.025；置信区间=0.5±2.58×0.025=0.5±0.0645=[0.4355, 0.5645]。说明：有99%的把握认为活跃率在43.55%到56.45%之间。", explain: "比例置信区间，99%置信水平。" },

{ chapter: "ch6", type: "填空题", q: "原假设为真时拒绝原假设的错误称为第______类错误。", blanks: ["一"], explain: "第一类错误是弃真。" },
{ chapter: "ch6", type: "填空题", q: "原假设为假时接受原假设的错误称为第______类错误。", blanks: ["二"], explain: "第二类错误是取伪。" },
{ chapter: "ch6", type: "填空题", q: "第一类错误的概率用______表示。", blanks: ["α"], explain: "第一类错误概率为α。" },

{ chapter: "ch6", type: "填空题", q: "第一类错误也称为______错误。", blanks: ["弃真"], explain: "第一类错误是弃真。" },
{ chapter: "ch6", type: "填空题", q: "第二类错误也称为______错误。", blanks: ["取伪"], explain: "第二类错误是取伪。" },
{ chapter: "ch6", type: "填空题", q: "在样本量固定时，α与β此消彼长，要同时减小两者需增大______。", blanks: ["样本量"], explain: "增大样本量可同时减小α和β。" },

{ chapter: "ch6", type: "判断题", q: "P>α时接受原假设。", options: ["正确", "错误"], answer: 1, explain: "P>α时不拒绝原假设，不等于接受。" },

{ chapter: "ch6", type: "判断题", q: "总体方差未知且样本量较小时，均值检验使用T统计量。", options: ["正确", "错误"], answer: 0, explain: "方差未知小样本用T统计量。" },
{ chapter: "ch6", type: "判断题", q: "总体方差检验使用F统计量。", options: ["正确", "错误"], answer: 1, explain: "方差检验用卡方统计量，不是F。" },
{ chapter: "ch6", type: "判断题", q: "两个总体方差比较使用F统计量。", options: ["正确", "错误"], answer: 0, explain: "方差比较用F统计量。" },
{ chapter: "ch6", type: "判断题", q: "拟合优度检验使用卡方统计量。", options: ["正确", "错误"], answer: 0, explain: "拟合优度检验用卡方统计量。" },
{ chapter: "ch6", type: "判断题", q: "独立性检验使用卡方统计量。", options: ["正确", "错误"], answer: 0, explain: "独立性检验用卡方统计量。" },
{ chapter: "ch6", type: "判断题", q: "双侧检验的拒绝域在分布两端。", options: ["正确", "错误"], answer: 0, explain: "双侧检验拒绝域在两端。" },
{ chapter: "ch6", type: "判断题", q: "右侧检验的拒绝域在分布右端。", options: ["正确", "错误"], answer: 0, explain: "右侧检验拒绝域在右端。" },
{ chapter: "ch6", type: "判断题", q: "左侧检验的拒绝域在分布左端。", options: ["正确", "错误"], answer: 0, explain: "左侧检验拒绝域在左端。" },
{ chapter: "ch6", type: "判断题", q: "α=0.05双侧检验的Z临界值为±1.96。", options: ["正确", "错误"], answer: 0, explain: "α=0.05双侧临界值1.96。" },
{ chapter: "ch6", type: "判断题", q: "α=0.01双侧检验的Z临界值为±2.58。", options: ["正确", "错误"], answer: 0, explain: "α=0.01双侧临界值2.58。" },
{ chapter: "ch6", type: "判断题", q: "α=0.05右侧检验的Z临界值为1.645。", options: ["正确", "错误"], answer: 0, explain: "右侧α=0.05临界值1.645。" },
{ chapter: "ch6", type: "判断题", q: "单侧检验比双侧检验更容易拒绝原假设。", options: ["正确", "错误"], answer: 0, explain: "相同α下单侧检验更容易拒绝。" },
{ chapter: "ch6", type: "判断题", q: "假设检验的结论是绝对的。", options: ["正确", "错误"], answer: 1, explain: "假设检验结论是概率性的。" },
{ chapter: "ch6", type: "判断题", q: "样本量越大，越容易拒绝原假设。", options: ["正确", "错误"], answer: 0, explain: "样本量越大，越容易检测到差异。" },
{ chapter: "ch6", type: "判断题", q: "统计显著一定意味着实际显著。", options: ["正确", "错误"], answer: 1, explain: "统计显著不等于实际显著。" },
{ chapter: "ch6", type: "判断题", q: "假设检验可以证明原假设为真。", options: ["正确", "错误"], answer: 1, explain: "假设检验不能证明原假设为真。" },
{ chapter: "ch6", type: "判断题", q: "检验功效越大，说明检验越敏感。", options: ["正确", "错误"], answer: 0, explain: "功效越大越敏感。" },
{ chapter: "ch6", type: "判断题", q: "配对样本均值比较使用配对T检验。", options: ["正确", "错误"], answer: 0, explain: "配对样本用配对T检验。" },
{ chapter: "ch6", type: "判断题", q: "两独立样本均值比较中，需要检验方差齐性。", options: ["正确", "错误"], answer: 0, explain: "两独立样本比较需要检验方差齐性。" },
{ chapter: "ch6", type: "判断题", q: "独立性检验的自由度等于(行数-1)×(列数-1)。", options: ["正确", "错误"], answer: 0, explain: "独立性检验自由度公式。" },
{ chapter: "ch6", type: "判断题", q: "假设检验中，原假设和备择假设可以同时成立。", options: ["正确", "错误"], answer: 1, explain: "原假设和备择假设互斥。" },
{ chapter: "ch6", type: "判断题", q: "假设检验中，α越小，拒绝原假设的门槛越高。", options: ["正确", "错误"], answer: 0, explain: "α越小，越难拒绝原假设。" },

// ===== 简答题 10 题 =====
{ chapter: "ch6", type: "简答题", q: "简述假设检验的基本步骤。", refAnswer: "1. 提出原假设H₀和备择假设H₁；2. 选择合适的检验统计量；3. 确定显著性水平α和拒绝域；4. 计算统计量的值；5. 根据统计量是否落入拒绝域（或比较P值与α）做出判断。", explain: "假设检验的五个基本步骤。" },
{ chapter: "ch6", type: "简答题", q: "简述第一类错误和第二类错误的区别。", refAnswer: "第一类错误是原假设为真时拒绝原假设（弃真），概率为α；第二类错误是原假设为假时接受原假设（取伪），概率为β。样本量固定时，α与β此消彼长；增大样本量可同时减小两者。", explain: "两类错误的定义和关系。" },
{ chapter: "ch6", type: "简答题", q: "简述P值的含义和判断规则。", refAnswer: "P值是在原假设为真的条件下，出现当前或更极端样本结果的概率。判断规则：P<α时拒绝原假设；P>α时不拒绝原假设。P值越小，拒绝原假设的证据越强。", explain: "P值的定义和判断规则。" },
{ chapter: "ch6", type: "简答题", q: "简述双侧检验与单侧检验的区别。", refAnswer: "双侧检验的备择假设用≠，拒绝域在分布两端，α平分到两端；单侧检验的备择假设用>或<，拒绝域在一端，α集中在一侧。在相同α下，单侧检验比双侧检验更容易拒绝原假设。", explain: "双侧与单侧检验的区别。" },
{ chapter: "ch6", type: "简答题", q: "简述检验功效的影响因素。", refAnswer: "检验功效=1-β，影响因素包括：1. 样本量：样本量越大，功效越高；2. 显著性水平α：α越大，功效越高；3. 效应量：真实差异越大，功效越高；4. 总体方差：方差越小，功效越高。", explain: "检验功效的四个影响因素。" },
{ chapter: "ch6", type: "简答题", q: "简述Z检验、T检验、χ²检验、F检验的适用场景。", refAnswer: "Z检验：总体方差已知或大样本均值检验；T检验：总体方差未知且小样本均值检验；χ²检验：方差检验、拟合优度检验、独立性检验；F检验：两个总体方差比较、方差分析。", explain: "四种检验的适用场景。" },
{ chapter: "ch6", type: "简答题", q: "简述假设检验中不拒绝原假设的含义。", refAnswer: "不拒绝原假设意味着样本数据没有提供足够证据拒绝原假设，但并不等于原假设一定正确。可能是原假设为真，也可能是样本量不足、检验功效低导致未能检测到差异。", explain: "不拒绝原假设的正确理解。" },
{ chapter: "ch6", type: "简答题", q: "简述统计显著性与实际显著性的区别。", refAnswer: "统计显著性指样本结果与原假设的差异在统计上显著，通常由P值判断；实际显著性指差异在业务或实际意义上是否重要。样本量很大时，微小的差异也可能统计显著，但未必有实际意义。", explain: "统计显著与实际显著的区别。" },
{ chapter: "ch6", type: "简答题", q: "简述独立性检验的基本原理。", refAnswer: "独立性检验用于判断两个分类变量是否独立。通过列联表计算实际频数与理论频数的差异，构造χ²统计量。若χ²值大于临界值（或P<α），则拒绝独立性假设，认为两变量相关。自由度为(r-1)(c-1)。", explain: "独立性检验的原理。" },
{ chapter: "ch6", type: "简答题", q: "简述假设检验在智能决策中的应用。", refAnswer: "假设检验用于验证业务假设，如新工艺是否显著优于旧工艺、两个模型误差方差是否相等、用户性别与购买品类是否独立等。结合AI工具，可以自动化执行检验流程，为数据驱动的智能决策提供统计依据，同时需注意统计显著与实际显著的平衡。", explain: "假设检验在智能决策中的应用。" },

// ===== 应用题 60 题 =====
{ chapter: "ch6", type: "应用题", q: "某电商平台想检验新推荐算法是否显著提高用户点击率。旧算法点击率0.10，新算法在1000次曝光中点击120次。请用Z检验判断新算法是否显著优于旧算法（α=0.05，右侧检验，Z₀.₀₅=1.645）。", refAnswer: "H₀：p=0.10，H₁：p>0.10。p̂=0.12。标准误=√(0.10×0.90/1000)≈0.00949。Z=(0.12-0.10)/0.00949≈2.11。2.11>1.645，拒绝H₀。结论：新算法显著优于旧算法。", explain: "单侧比例Z检验。" },
{ chapter: "ch6", type: "应用题", q: "某医疗器械企业想检验新工艺是否显著缩短生产时间。旧工艺平均45分钟，新工艺抽16件，样本均值42分钟，样本标准差8分钟。请用T检验判断（α=0.05，左侧检验，t₀.₀₅(15)=-1.753）。", refAnswer: "H₀：μ=45，H₁：μ<45。标准误=8/4=2。t=(42-45)/2=-1.5。-1.5>-1.753，不拒绝H₀。结论：没有足够证据认为新工艺显著缩短生产时间。", explain: "单侧T检验。" },
{ chapter: "ch6", type: "应用题", q: "某金融风控团队想检验两个模型的预测误差方差是否相等。模型A样本20，方差100；模型B样本25，方差64。请用F检验判断（α=0.05，F₀.₀₂₅(19,24)=2.11）。", refAnswer: "H₀：σ₁²=σ₂²，H₁：σ₁²≠σ₂²。F=100/64=1.5625。1.5625<2.11，不拒绝H₀。结论：没有足够证据认为两个模型误差方差不同。", explain: "F检验用于方差齐性。" },
{ chapter: "ch6", type: "应用题", q: "某电商平台想检验用户性别与购买品类是否独立。列联表3×4，计算χ²=8.5，α=0.05，χ²₀.₀₅(6)=12.59。请判断。", refAnswer: "H₀：性别与购买品类独立。自由度=(3-1)(4-1)=6。8.5<12.59，不拒绝H₀。结论：没有足够证据认为性别与购买品类相关。", explain: "独立性检验。" },
{ chapter: "ch6", type: "应用题", q: "某医院想检验新药是否显著降低血压。旧药平均降低10mmHg，新药抽25人，平均降低12mmHg，标准差4mmHg。请用T检验判断（α=0.05，右侧检验，t₀.₀₅(24)=1.711）。", refAnswer: "H₀：μ=10，H₁：μ>10。标准误=4/5=0.8。t=(12-10)/0.8=2.5。2.5>1.711，拒绝H₀。结论：新药显著降低血压更多。", explain: "单侧T检验。" },
{ chapter: "ch6", type: "应用题", q: "某电商平台想检验促销活动是否显著提高客单价。促销前平均250元，促销后抽100笔订单，平均260元，标准差50元。请用Z检验判断（α=0.05，右侧检验，Z₀.₀₅=1.645）。", refAnswer: "H₀：μ=250，H₁：μ>250。标准误=50/10=5。Z=(260-250)/5=2。2>1.645，拒绝H₀。结论：促销活动显著提高客单价。", explain: "单侧Z检验。" },
{ chapter: "ch6", type: "应用题", q: "某制造企业想检验产品合格率是否达到98%。抽500件，合格480件。请用Z检验判断（α=0.05，左侧检验，Z₀.₀₅=-1.645）。", refAnswer: "H₀：p=0.98，H₁：p<0.98。p̂=0.96。标准误=√(0.98×0.02/500)≈0.00626。Z=(0.96-0.98)/0.00626≈-3.19。-3.19<-1.645，拒绝H₀。结论：合格率显著低于98%。", explain: "单侧比例Z检验。" },
{ chapter: "ch6", type: "应用题", q: "某教育机构想检验新教学方法是否显著提高成绩。旧方法平均75分，新方法抽36人，平均78分，标准差12分。请用Z检验判断（α=0.05，右侧检验，Z₀.₀₅=1.645）。", refAnswer: "H₀：μ=75，H₁：μ>75。标准误=12/6=2。Z=(78-75)/2=1.5。1.5<1.645，不拒绝H₀。结论：没有足够证据认为新方法显著提高成绩。", explain: "单侧Z检验。" },
{ chapter: "ch6", type: "应用题", q: "某电商平台想检验两个推荐算法的点击率是否有显著差异。算法A曝光500次点击50次，算法B曝光500次点击70次。请用Z检验判断（α=0.05，双侧检验，Z₀.₀₂₅=1.96）。", refAnswer: "p̂A=0.10，p̂B=0.14，合并比例=120/1000=0.12。标准误=√(0.12×0.88×(1/500+1/500))≈0.0206。Z=(0.14-0.10)/0.0206≈1.94。1.94<1.96，不拒绝H₀。结论：没有足够证据认为两个算法点击率有显著差异。", explain: "两比例Z检验。" },
{ chapter: "ch6", type: "应用题", q: "某制造企业想检验两条生产线的次品率是否有显著差异。甲线抽400件次品20件，乙线抽500件次品15件。请用Z检验判断（α=0.05，双侧检验，Z₀.₀₂₅=1.96）。", refAnswer: "p̂甲=0.05，p̂乙=0.03，合并比例=35/900≈0.0389。标准误=√(0.0389×0.9611×(1/400+1/500))≈0.0129。Z=(0.05-0.03)/0.0129≈1.55。1.55<1.96，不拒绝H₀。结论：两条线次品率无显著差异。", explain: "两比例Z检验。" },
{ chapter: "ch6", type: "应用题", q: "某电商平台想检验用户性别与是否购买是否独立。列联表2×2，男性购买80人未购买120人，女性购买120人未购买80人。计算χ²，α=0.05，χ²₀.₀₅(1)=3.84。", refAnswer: "总人数400，购买200，未购买200。理论频数：男购买100，男未购买100，女购买100，女未购买100。χ²=(80-100)²/100+(120-100)²/100+(120-100)²/100+(80-100)²/100=4+4+4+4=16。16>3.84，拒绝H₀。结论：性别与购买显著相关。", explain: "独立性检验。" },
{ chapter: "ch6", type: "应用题", q: "某医院想检验两种疗法的有效率是否有显著差异。疗法A抽200人有效160人，疗法B抽200人有效140人。请用Z检验判断（α=0.05，双侧检验，Z₀.₀₂₅=1.96）。", refAnswer: "p̂A=0.8，p̂B=0.7，合并比例=300/400=0.75。标准误=√(0.75×0.25×(1/200+1/200))≈0.0433。Z=(0.8-0.7)/0.0433≈2.31。2.31>1.96，拒绝H₀。结论：两种疗法有效率有显著差异。", explain: "两比例Z检验。" },
{ chapter: "ch6", type: "应用题", q: "某电商平台想检验新页面是否显著提高转化率。旧页面转化率0.10，新页面在800次访问中转化96次。请用Z检验判断（α=0.05，右侧检验，Z₀.₀₅=1.645）。", refAnswer: "H₀：p=0.10，H₁：p>0.10。p̂=0.12。标准误=√(0.10×0.90/800)≈0.0106。Z=(0.12-0.10)/0.0106≈1.89。1.89>1.645，拒绝H₀。结论：新页面显著提高转化率。", explain: "单侧比例Z检验。" },
{ chapter: "ch6", type: "应用题", q: "某金融平台想检验用户平均投资金额是否显著高于20000元。抽81人，样本均值21000元，标准差8000元。请用Z检验判断（α=0.05，右侧检验，Z₀.₀₅=1.645）。", refAnswer: "H₀：μ=20000，H₁：μ>20000。标准误=8000/9≈888.9。Z=(21000-20000)/888.9≈1.125。1.125<1.645，不拒绝H₀。结论：没有足够证据认为平均投资金额显著高于20000元。", explain: "单侧Z检验。" },

{ chapter: "ch6", type: "应用题", q: "某平台想检验用户平均复购率是否显著高于40%。抽600人，复购258人。请用Z检验判断（α=0.05，右侧检验，Z₀.₀₅=1.645）。", refAnswer: "H₀：p=0.40，H₁：p>0.40。p̂=0.43。标准误=√(0.40×0.60/600)≈0.02。Z=(0.43-0.40)/0.02=1.5。1.5<1.645，不拒绝H₀。结论：没有足够证据认为复购率显著高于40%。", explain: "单侧比例Z检验。" },
{ chapter: "ch6", type: "应用题", q: "某平台想检验用户平均流失率是否显著低于10%。抽500人，流失45人。请用Z检验判断（α=0.05，左侧检验，Z₀.₀₅=-1.645）。", refAnswer: "H₀：p=0.10，H₁：p<0.10。p̂=0.09。标准误=√(0.10×0.90/500)≈0.0134。Z=(0.09-0.10)/0.0134≈-0.75。-0.75>-1.645，不拒绝H₀。结论：没有足够证据认为流失率显著低于10%。", explain: "单侧比例Z检验。" },
{ chapter: "ch6", type: "应用题", q: "某平台想检验用户平均活跃率是否显著高于50%。抽400人，活跃210人。请用Z检验判断（α=0.05，右侧检验，Z₀.₀₅=1.645）。", refAnswer: "H₀：p=0.50，H₁：p>0.50。p̂=0.525。标准误=√(0.50×0.50/400)=0.025。Z=(0.525-0.50)/0.025=1。1<1.645，不拒绝H₀。结论：没有足够证据认为活跃率显著高于50%。", explain: "单侧比例Z检验。" },
{ chapter: "ch6", type: "应用题", q: "某平台想检验用户平均推荐率是否显著高于50%。抽300人，推荐160人。请用Z检验判断（α=0.05，右侧检验，Z₀.₀₅=1.645）。", refAnswer: "H₀：p=0.50，H₁：p>0.50。p̂=0.533。标准误=√(0.50×0.50/300)≈0.0289。Z=(0.533-0.50)/0.0289≈1.14。1.14<1.645，不拒绝H₀。结论：没有足够证据认为推荐率显著高于50%。", explain: "单侧比例Z检验。" },
{ chapter: "ch6", type: "应用题", q: "某平台想检验用户平均好评率是否显著高于90%。抽500条评论，好评460条。请用Z检验判断（α=0.05，右侧检验，Z₀.₀₅=1.645）。", refAnswer: "H₀：p=0.90，H₁：p>0.90。p̂=0.92。标准误=√(0.90×0.10/500)≈0.0134。Z=(0.92-0.90)/0.0134≈1.49。1.49<1.645，不拒绝H₀。结论：没有足够证据认为好评率显著高于90%。", explain: "单侧比例Z检验。" },
{ chapter: "ch6", type: "应用题", q: "某平台想检验用户平均差评率是否显著低于5%。抽400条评论，差评14条。请用Z检验判断（α=0.05，左侧检验，Z₀.₀₅=-1.645）。", refAnswer: "H₀：p=0.05，H₁：p<0.05。p̂=0.035。标准误=√(0.05×0.95/400)≈0.0109。Z=(0.035-0.05)/0.0109≈-1.38。-1.38>-1.645，不拒绝H₀。结论：没有足够证据认为差评率显著低于5%。", explain: "单侧比例Z检验。" },
{ chapter: "ch6", type: "应用题", q: "某平台想检验用户平均分享率是否显著高于20%。抽400人，分享96人。请用Z检验判断（α=0.05，右侧检验，Z₀.₀₅=1.645）。", refAnswer: "H₀：p=0.20，H₁：p>0.20。p̂=0.24。标准误=√(0.20×0.80/400)≈0.02。Z=(0.24-0.20)/0.02=2。2>1.645，拒绝H₀。结论：分享率显著高于20%。", explain: "单侧比例Z检验。" },
{ chapter: "ch6", type: "应用题", q: "某平台想检验用户平均收藏率是否显著高于20%。抽500人，收藏115人。请用Z检验判断（α=0.05，右侧检验，Z₀.₀₅=1.645）。", refAnswer: "H₀：p=0.20，H₁：p>0.20。p̂=0.23。标准误=√(0.20×0.80/500)≈0.0179。Z=(0.23-0.20)/0.0179≈1.68。1.68>1.645，拒绝H₀。结论：收藏率显著高于20%。", explain: "单侧比例Z检验。" },
{ chapter: "ch6", type: "应用题", q: "某平台想检验用户平均加购率是否显著高于20%。抽300人，加购69人。请用Z检验判断（α=0.05，右侧检验，Z₀.₀₅=1.645）。", refAnswer: "H₀：p=0.20，H₁：p>0.20。p̂=0.23。标准误=√(0.20×0.80/300)≈0.0231。Z=(0.23-0.20)/0.0231≈1.30。1.30<1.645，不拒绝H₀。结论：没有足够证据认为加购率显著高于20%。", explain: "单侧比例Z检验。" },
{ chapter: "ch6", type: "应用题", q: "某平台想检验用户平均下单率是否显著高于20%。抽800人，下单180人。请用Z检验判断（α=0.05，右侧检验，Z₀.₀₅=1.645）。", refAnswer: "H₀：p=0.20，H₁：p>0.20。p̂=0.225。标准误=√(0.20×0.80/800)≈0.0141。Z=(0.225-0.20)/0.0141≈1.77。1.77>1.645，拒绝H₀。结论：下单率显著高于20%。", explain: "单侧比例Z检验。" },
