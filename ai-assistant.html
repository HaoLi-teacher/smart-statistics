<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>智能统计分析与决策 · AI 助手</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", Arial, sans-serif;
    max-width: 860px; margin: 0 auto; padding: 20px;
    background: #f0f3f8; color: #2c3e50;
    display: flex; flex-direction: column; height: 100vh;
  }
  h1 { font-size: 20px; text-align: center; margin-bottom: 4px; }
  .subtitle { text-align: center; color: #7f8c8d; font-size: 13px; margin-bottom: 16px; }

  .panel {
    background: #fff; border-radius: 12px; padding: 16px 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 12px;
  }

  /* 设置区 */
  .setup-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  .setup-row label { font-size: 13px; color: #34495e; white-space: nowrap; }
  .setup-row input {
    flex: 1; padding: 8px 12px; border: 1px solid #ddd;
    border-radius: 8px; font-size: 13px; font-family: inherit;
  }
  .setup-row select {
    padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 13px; font-family: inherit;
  }
  .btn {
    background: #3498db; color: #fff; border: none; padding: 8px 18px;
    border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: bold;
    transition: background 0.2s; white-space: nowrap;
  }
  .btn:hover { background: #2980b9; }
  .btn.green { background: #27ae60; }
  .btn.green:hover { background: #219150; }
  .btn.gray { background: #95a5a6; }
  .btn.gray:hover { background: #7f8c8d; }
  .status { font-size: 12px; color: #7f8c8d; text-align: center; }
  .status.ok { color: #27ae60; }
  .status.err { color: #e74c3c; }

  /* 聊天区 */
  .chat-box {
    flex: 1; background: #fff; border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    padding: 16px; overflow-y: auto; margin-bottom: 12px;
    min-height: 300px;
  }
  .msg { margin-bottom: 14px; display: flex; gap: 10px; }
  .msg .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: bold; flex-shrink: 0;
  }
  .msg.user .avatar { background: #3498db; color: #fff; }
  .msg.ai .avatar { background: #27ae60; color: #fff; }
  .msg .bubble {
    padding: 10px 14px; border-radius: 10px; font-size: 14px;
    line-height: 1.7; max-width: 80%; white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble { background: #eaf2f8; color: #2c3e50; }
  .msg.ai .bubble { background: #eafaf1; color: #1e6b3a; }
  .msg .bubble.loading { color: #95a5a6; font-style: italic; }

  /* 输入区 */
  .input-area { display: flex; gap: 10px; }
  .input-area textarea {
    flex: 1; padding: 12px 14px; border: 2px solid #ecf0f1;
    border-radius: 10px; font-size: 14px; font-family: inherit;
    resize: none; min-height: 52px; max-height: 120px;
  }
  .input-area textarea:focus { outline: none; border-color: #3498db; }

  .hint {
    font-size: 12px; color: #95a5a6; text-align: center;
    margin-top: 8px; line-height: 1.6;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<h1>智能统计分析与决策 · AI 助手</h1>
<div class="subtitle">概念引导 · 决策审视 · 苏格拉底式追问</div>

<!-- 设置区 -->
<div class="panel" id="setupPanel">
  <div class="setup-row">
    <label>API Key：</label>
    <input type="password" id="apiKeyInput" placeholder="请输入通义千问 API Key（sk-开头）">
    <button class="btn green" id="saveKeyBtn">保存并连接</button>
  </div>
  <div class="setup-row">
    <label>助手模式：</label>
    <select id="modeSelect">
      <option value="concept">概念引导助手（只提问，不给答案）</option>
      <option value="code">操作答疑助手（给代码和步骤）</option>
      <option value="review">决策审视助手（追问与挑战）</option>
    </select>
    <button class="btn gray" id="clearBtn">清空对话</button>
  </div>
  <div class="status" id="statusText">未连接</div>
</div>

<!-- 聊天区 -->
<div class="chat-box" id="chatBox">
  <div class="msg ai">
    <div class="avatar">AI</div>
    <div class="bubble">你好！我是《智能统计分析与决策》课程的 AI 助手。

当前模式：<b>概念引导助手</b>。

我的原则是——不直接给你答案，而是通过提问帮你自己想清楚。你可以问我任何课程相关的问题，比如：

• “什么是中心极限定理？”
• “为什么样本量大了样本均值会趋近正态？”
• “置信水平和置信区间有什么区别？”

试试看，我会先反问你一个问题。</div>
  </div>
</div>

<!-- 输入区 -->
<div class="input-area">
  <textarea id="userInput" placeholder="输入你的问题……（Enter 发送，Shift+Enter 换行）"></textarea>
  <button class="btn" id="sendBtn" style="padding: 12px 24px;">发送</button>
</div>
<div class="hint">
  本助手基于苏格拉底式提问法设计，旨在帮助你通过自己的思考理解统计概念。<br>
  API Key 仅保存在你的浏览器本地，不会上传到任何服务器。
</div>

<script>
// ==================== 全局状态 ====================
var API_KEY = '';
var MODE = 'concept';
var MESSAGES = []; // 对话历史

// ==================== 系统提示词 ====================
var SYSTEM_PROMPTS = {
  concept: `你是《智能统计分析与决策》课程的概念引导助手。你的角色是帮助学生通过自己的思考理解统计概念，而不是直接给出答案。

【知识范围】
你只能基于统计学基础知识和本课程的教学内容回答。如果学生的问题超出课程范围，说："这个问题可能超出了当前课程材料，建议你查阅教材或联系李昊老师。"

【交互规则】
1. 学生提出概念性问题时，先反问一个引导性问题，帮助学生暴露自己的理解。
2. 如果学生连续追问两次仍无法推进，可以给一个简短的提示，但不给完整答案。
3. 每次回答最后，追问一个与当前概念相关的新问题。
4. 如果学生问"怎么做这道题"，引导他们回到决策任务链："先想想这个问题属于问题识别、方法选择、模型应用、结果审视、决策建议中的哪个环节？"

【语气】
专业、耐心、简洁。不使用表情符号。每次回答不超过200字。`,

  code: `你是《智能统计分析与决策》课程的操作答疑助手。你的角色是帮助学生解决代码和软件操作问题。

【知识范围】
你只能基于Python、R、统计分析方法的标准用法回答。如果学生的问题涉及具体课程数据，提醒他们参考课程案例库中的数据集说明。

【交互规则】
1. 学生问代码问题时，先给出可直接运行的代码片段。
2. 代码要有注释，说明关键步骤。
3. 如果涉及统计方法选择，简短说明为什么用这个方法。
4. 如果代码可能出错，提前说明常见的坑。
5. 回答最后，问一句"你打算用这个代码分析什么数据？"引导学生回到业务场景。

【语气】
专业、直接、实用。每次回答不超过400字。`,

  review: `你是《智能统计分析与决策》课程的决策审视助手。你的角色是挑战学生的分析结论，暴露他们的思维盲区。

【知识范围】
你熟悉统计学中的常见误区：相关不等于因果、R²高不代表模型好、统计显著不等于实际显著、过拟合、多重共线性、幸存者偏差等。

【交互规则】
1. 当学生给出一个分析结论时，不评价对错，而是追问一个挑战性问题。
2. 追问方向包括：因果关系、遗漏变量、样本代表性、假设条件、业务代价、伦理边界。
3. 如果学生连续三次都无法回应你的追问，给一个简短的提示，但不给完整答案。
4. 每次回答最后，追问一个与当前决策相关的新问题。

【语气】
专业、冷静、有挑战性。每次回答不超过200字。`
};

// ==================== 页面初始化 ====================
window.addEventListener('load', function() {
  // 恢复已保存的 API Key
  var savedKey = localStorage.getItem('qwen_api_key');
  if (savedKey) {
    document.getElementById('apiKeyInput').value = savedKey;
    API_KEY = savedKey;
    updateStatus('已连接（API Key 已保存）', 'ok');
  }

  // 绑定事件
  document.getElementById('saveKeyBtn').addEventListener('click', saveKey);
  document.getElementById('sendBtn').addEventListener('click', sendMessage);
  document.getElementById('clearBtn').addEventListener('click', clearChat);
  document.getElementById('modeSelect').addEventListener('change', switchMode);

  var input = document.getElementById('userInput');
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
});

// ==================== 保存 API Key ====================
function saveKey() {
  var key = document.getElementById('apiKeyInput').value.trim();
  if (!key) {
    updateStatus('请输入 API Key', 'err');
    return;
  }
  if (!key.startsWith('sk-')) {
    updateStatus('API Key 格式不正确（应以 sk- 开头）', 'err');
    return;
  }
  API_KEY = key;
  localStorage.setItem('qwen_api_key', key);
  updateStatus('已连接（API Key 已保存到本地）', 'ok');
}

// ==================== 切换助手模式 ====================
function switchMode() {
  MODE = document.getElementById('modeSelect').value;
  var names = { concept: '概念引导助手', code: '操作答疑助手', review: '决策审视助手' };
  var tips = {
    concept: '我的原则是——不直接给你答案，而是通过提问帮你自己想清楚。',
    code: '我可以给你代码和操作步骤，但请告诉我你打算分析什么数据。',
    review: '我会挑战你的分析结论，追问因果关系、遗漏变量和业务代价。'
  };
  addMessage('ai', '已切换到【' + names[MODE] + '】。' + tips[MODE]);
}

// ==================== 更新状态 ====================
function updateStatus(text, type) {
  var el = document.getElementById('statusText');
  el.textContent = text;
  el.className = 'status' + (type ? ' ' + type : '');
}

// ==================== 添加消息到界面 ====================
function addMessage(role, text) {
  var chatBox = document.getElementById('chatBox');
  var div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
  div.innerHTML =
    '<div class="avatar">' + (role === 'user' ? '我' : 'AI') + '</div>' +
    '<div class="bubble">' + escapeHtml(text) + '</div>';
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}

// ==================== 添加加载中消息 ====================
function addLoadingMessage() {
  var chatBox = document.getElementById('chatBox');
  var div = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML =
    '<div class="avatar">AI</div>' +
    '<div class="bubble loading">正在思考……</div>';
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}

// ==================== 发送消息 ====================
async function sendMessage() {
  var input = document.getElementById('userInput');
  var text = input.value.trim();
  if (!text) return;

  if (!API_KEY) {
    updateStatus('请先填写 API Key 并保存', 'err');
    return;
  }

  // 显示用户消息
  addMessage('user', text);
  input.value = '';

  // 记录到历史
  MESSAGES.push({ role: 'user', content: text });

  // 显示加载中
  var loadingDiv = addLoadingMessage();

  try {
    // 构造请求
    var messages = [
      { role: 'system', content: SYSTEM_PROMPTS[MODE] }
    ].concat(MESSAGES);

    var response = await fetch('https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + API_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: 'qwen-turbo',
        messages: messages,
        temperature: 0.3,
        max_tokens: 800
      })
    });

    var data = await response.json();

    // 移除加载中
    loadingDiv.remove();

    if (data.error) {
      addMessage('ai', 'API 调用出错：' + (data.error.message || JSON.stringify(data.error)));
      updateStatus('API 调用失败', 'err');
      return;
    }

    var reply = data.choices && data.choices[0] && data.choices[0].message
      ? data.choices[0].message.content
      : '（未收到有效回复）';

    addMessage('ai', reply);
    MESSAGES.push({ role: 'assistant', content: reply });

  } catch (err) {
    loadingDiv.remove();
    addMessage('ai', '请求失败：' + err.message + '\n\n请检查网络连接和 API Key 是否正确。');
    updateStatus('请求失败', 'err');
  }
}

// ==================== 清空对话 ====================
function clearChat() {
  if (!confirm('确定清空当前对话吗？')) return;
  MESSAGES = [];
  var chatBox = document.getElementById('chatBox');
  chatBox.innerHTML = '';
  addMessage('ai', '对话已清空。你可以继续提问。');
}

// ==================== HTML 转义 ====================
function escapeHtml(text) {
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
</script>
</body>
</html>
